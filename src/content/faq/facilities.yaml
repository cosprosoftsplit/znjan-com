id: facilities-faq
question:
  en: "What facilities are available at Žnjan Beach?"
  hr: "Koji su sadržaji dostupni na plaži Žnjan?"
  de: "Welche Einrichtungen gibt es am Strand Žnjan?"
  it: "Quali strutture sono disponibili alla spiaggia di Žnjan?"
  fr: "Quels équipements sont disponibles à la plage de Žnjan ?"
  es: "¿Qué servicios e instalaciones ofrece la playa de Žnjan?"
  pl: "Jakie udogodnienia są dostępne na plaży Žnjan?"
  nl: "Welke voorzieningen zijn er op het strand van Žnjan?"
answer:
  en: "Žnjan Beach offers comprehensive facilities including: showers, changing rooms, sunbed and umbrella rentals, lifeguard stations (summer), 11 pavilion restaurants and beach bars, public toilets, ~981 parking spaces (530 underground + 451 outdoor), three beach volleyball courts, a tennis court, basketball and cage-football areas, a 1,200 m² skate park, a 600 m² children's playground, splash pads, an amphitheatre with steel dome for events, wheelchair-accessible paths and a hydraulic sea-access elevator, and ~48,000 m² of landscaped green space. The public sports areas are free to use, there is no current reservation system, and access is first-come, first-served."
  hr: "Plaža Žnjan nudi sveobuhvatne sadržaje: tuševe, kabine za presvlačenje, najam ležaljki i suncobrana, spasilačke postaje (ljeti), 11 paviljona s restoranima i beach barovima, javne toalete, ~981 parkirno mjesto (530 podzemnih + 451 vanjsko), tri terena za odbojku na pijesku, teniski teren, košarkaške i cage nogometne zone, skate park od 1.200 m², dječje igralište od 600 m², vodene prskalice, amfiteatar sa čeličnom kupolom za događanja, pristupačne staze i hidraulični lift za ulazak u more te ~48.000 m² uređenog zelenila. Javne sportske zone su besplatne, trenutačno ne postoji sustav rezervacija i pristup je po principu tko prvi dođe, prvi koristi."
  de: "Der Strand Žnjan bietet umfassende Einrichtungen: Duschen, Umkleideräume, Liegen-/Sonnenschirmverleih, Rettungsschwimmerstationen (Sommer), 11 Pavillon-Restaurants und Strandbars, öffentliche Toiletten, ~981 Parkplätze (530 unterirdisch + 451 im Freien), drei Beachvolleyballplätze, einen Tennisplatz, Basketball- und Cage-Fußball-Bereiche, einen 1.200 m² Skatepark, einen 600 m² Kinderspielplatz, Wasserspielplätze, ein Amphitheater mit Stahlkuppel für Veranstaltungen, barrierefreie Wege und einen hydraulischen Meereszugangslift sowie ~48.000 m² landschaftlich gestaltete Grünflächen. Die öffentlichen Sportflächen sind kostenlos nutzbar, es gibt derzeit kein Reservierungssystem und der Zugang funktioniert nach dem Prinzip 'wer zuerst kommt, spielt zuerst'."
  it: "La spiaggia di Žnjan offre strutture complete: docce, spogliatoi, noleggio lettini e ombrelloni, postazioni di salvataggio (estate), 11 padiglioni con ristoranti e bar, servizi igienici pubblici, ~981 posti auto (530 sotterranei + 451 esterni), tre campi da beach volley, un campo da tennis, aree per basket e calcetto in gabbia, uno skate park di 1.200 m², un parco giochi di 600 m², giochi d'acqua, un anfiteatro con cupola in acciaio per eventi, percorsi accessibili e ascensore idraulico per l'accesso al mare e ~48.000 m² di spazi verdi. Le aree sportive pubbliche sono gratuite, al momento non esiste un sistema di prenotazione e l'accesso funziona in base al principio del primo arrivato, primo servito."
  fr: "La plage de Žnjan propose des équipements complets : douches, cabines de change, location de transats et de parasols, postes de secours (en été), 11 pavillons avec restaurants et bars de plage, toilettes publiques, environ 981 places de stationnement (530 en sous-sol + 451 en extérieur), trois terrains de beach-volley, un court de tennis, des espaces de basket et de football en cage, un skatepark de 1 200 m², une aire de jeux pour enfants de 600 m², des jeux d'eau, un amphithéâtre coiffé d'un dôme en acier pour les événements, des allées accessibles aux fauteuils roulants et un ascenseur hydraulique pour l'accès à la mer, ainsi qu'environ 48 000 m² d'espaces verts paysagers. Les espaces sportifs publics sont gratuits, il n'existe pour l'instant aucun système de réservation et l'accès se fait selon le principe du premier arrivé, premier servi."
  es: "La playa de Žnjan ofrece instalaciones completas: duchas, vestuarios, alquiler de hamacas y sombrillas, puestos de socorristas (en verano), 11 pabellones con restaurantes y chiringuitos, aseos públicos, unas 981 plazas de aparcamiento (530 subterráneas + 451 al aire libre), tres pistas de vóley playa, una pista de tenis, zonas de baloncesto y fútbol en jaula, un skatepark de 1.200 m², un parque infantil de 600 m², juegos de agua, un anfiteatro con cúpula de acero para eventos, senderos accesibles para sillas de ruedas y un ascensor hidráulico de acceso al mar, además de unos 48.000 m² de zonas verdes ajardinadas. Las zonas deportivas públicas son de uso gratuito, por ahora no existe sistema de reservas y el acceso se realiza por orden de llegada."
  pl: "Plaża Žnjan oferuje kompleksowe udogodnienia: prysznice, przebieralnie, wypożyczalnię leżaków i parasoli, stanowiska ratowników (latem), 11 pawilonów z restauracjami i barami plażowymi, publiczne toalety, około 981 miejsc parkingowych (530 podziemnych + 451 naziemnych), trzy boiska do siatkówki plażowej, kort tenisowy, strefy do koszykówki i piłki nożnej w klatce, skatepark o powierzchni 1200 m², plac zabaw dla dzieci o powierzchni 600 m², wodne zraszacze, amfiteatr ze stalową kopułą na wydarzenia, ścieżki dostępne dla wózków inwalidzkich oraz hydrauliczną windę umożliwiającą wejście do morza, a także około 48 000 m² zagospodarowanych terenów zielonych. Publiczne strefy sportowe są bezpłatne, obecnie nie ma systemu rezerwacji, a wstęp odbywa się według kolejności przybycia."
  nl: "Het strand van Žnjan biedt uitgebreide voorzieningen: douches, kleedhokjes, verhuur van ligbedden en parasols, reddingsposten (in de zomer), 11 paviljoens met restaurants en strandbars, openbare toiletten, ongeveer 981 parkeerplaatsen (530 ondergronds + 451 buiten), drie beachvolleybalvelden, een tennisbaan, basketbal- en cagevoetbalzones, een skatepark van 1.200 m², een kinderspeeltuin van 600 m², waterspeeltjes, een amfitheater met stalen koepel voor evenementen, rolstoeltoegankelijke paden en een hydraulische lift voor toegang tot de zee, plus ongeveer 48.000 m² aangelegd groen. De openbare sportzones zijn gratis te gebruiken, er is momenteel geen reserveringssysteem en de toegang werkt volgens het principe wie het eerst komt, het eerst maalt."
category: general
