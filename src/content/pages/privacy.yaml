description:
  en: "Znjan.com privacy policy — how we handle your data."
  hr: "Politika privatnosti Znjan.com — kako postupamo s vašim podacima."
  de: "Datenschutzrichtlinie von Znjan.com — wie wir mit Ihren Daten umgehen."
  it: "Informativa sulla privacy di Znjan.com — come gestiamo i tuoi dati."
  fr: "Politique de confidentialité de Znjan.com — comment nous traitons vos données."
  es: "Política de privacidad de Znjan.com — cómo tratamos tus datos."
  pl: "Polityka prywatności Znjan.com — jak przetwarzamy Twoje dane."
  nl: "Privacybeleid van Znjan.com — hoe wij met uw gegevens omgaan."
content:
  en: "Znjan.com respects your privacy. This policy explains how we handle information across the public website and community features.\n\n**Public browsing:** You can browse guides, places, beach areas, and sports access information without creating an account. The sports access pages explain that the public sports areas are free to use, have no current reservation system, and operate on a first-come, first-served basis.\n\n**Accounts and sign-in:** If you sign in with Google, we store the minimum account data needed to run the community, such as your email address, display name, Google subject identifier, and secure session records.\n\n**Community content:** Posts, comments, profile display names, and other participation signals are part of a public community product. Do not post information you want to keep private.\n\n**Moderation and admin access:** Approved admins may access the moderation and operational data needed to review community content, investigate reported issues, and manage public updates.\n\n**Analytics:** We use Cloudflare Web Analytics, which does not use marketing cookies and does not create personally identifiable analytics profiles. We review aggregate traffic and performance data.\n\n**Sessions and security:** We do not use advertising cookies. If you sign in, we use secure session cookies so the website can keep you signed in and protect your account.\n\n**Contact and support messages:** If you email us or use a contact flow, we process the information you send only to respond, investigate operational issues, or keep the directory accurate.\n\n**Third-party services:** We rely on Google OAuth for sign-in and OpenStreetMap for maps. Affiliate partners or external services you click may apply their own privacy policies.\n\n**Your rights:** Under GDPR, you can request access, correction, export, or deletion of personal data we hold about you. Contact privacy@znjan.com for privacy requests or info@znjan.com for operational and directory issues."
  hr: "Znjan.com poštuje vašu privatnost. Ova politika objašnjava kako postupamo s informacijama na javnoj web stranici i u funkcijama zajednice.\n\n**Javno pregledavanje:** Vodiče, mjesta, zone plaže i informacije o sportskom pristupu možete pregledavati bez otvaranja računa. Stranice o sportskom pristupu objašnjavaju da su javne sportske zone besplatne, da trenutačno ne postoji sustav rezervacija i da rade po principu tko prvi dođe, prvi koristi.\n\n**Račun i prijava:** Ako se prijavite putem Googlea, pohranjujemo minimalne podatke potrebne za rad zajednice, poput email adrese, javnog imena, Google identifikatora i sigurnih zapisa sesije.\n\n**Sadržaj zajednice:** Objave, komentari, javna imena profila i drugi signali sudjelovanja dio su javnog proizvoda zajednice. Nemojte objavljivati informacije koje želite zadržati privatnima.\n\n**Moderacija i admin pristup:** Odobreni administratori mogu pristupiti podacima potrebnima za moderaciju zajednice, provjeru prijavljenih problema i upravljanje javnim informacijama.\n\n**Analitika:** Koristimo Cloudflare Web Analytics, koji ne koristi marketinške kolačiće i ne stvara analitičke profile povezane s identitetom osobe. Pregledavamo samo agregirane podatke o prometu i performansama.\n\n**Sesije i sigurnost:** Ne koristimo oglašivačke kolačiće. Ako se prijavite, koristimo sigurne kolačiće sesije kako bi vas web stranica mogla zadržati prijavljenima i zaštititi vaš račun.\n\n**Kontakt i poruke podrške:** Ako nam pošaljete email ili koristite kontaktni kanal, obrađujemo podatke koje pošaljete samo kako bismo odgovorili, istražili operativni problem ili održavali točnost direktorija.\n\n**Usluge trećih strana:** Za prijavu koristimo Google OAuth, a za karte OpenStreetMap. Affiliate partneri ili vanjske usluge na koje kliknete mogu primjenjivati vlastite politike privatnosti.\n\n**Vaša prava:** Prema GDPR-u možete zatražiti pristup, ispravak, izvoz ili brisanje osobnih podataka koje imamo o vama. Za upite o privatnosti javite se na privacy@znjan.com, a za operativne i direktorske probleme na info@znjan.com."
  de: "Znjan.com respektiert Ihre Privatsphäre. Diese Richtlinie erklärt, wie wir Informationen auf der öffentlichen Website und in den Community-Funktionen verarbeiten.\n\n**Öffentliches Browsing:** Sie können Guides, Orte, Strandbereiche und Informationen zum Sportzugang durchsuchen, ohne ein Konto anzulegen. Die Sportzugangsseiten erklären, dass die öffentlichen Sportflächen kostenlos nutzbar sind, derzeit kein Reservierungssystem besteht und alles nach dem Prinzip 'wer zuerst kommt, spielt zuerst' funktioniert.\n\n**Konto und Anmeldung:** Wenn Sie sich mit Google anmelden, speichern wir die Mindestdaten, die für die Community nötig sind, etwa Ihre E-Mail-Adresse, Ihren Anzeigenamen, die Google-Sub-ID und sichere Sitzungsdaten.\n\n**Community-Inhalte:** Beiträge, Kommentare, öffentliche Profilnamen und andere Teilnahmesignale sind Teil eines öffentlichen Community-Produkts. Veröffentlichen Sie daher keine Informationen, die privat bleiben sollen.\n\n**Moderation und Admin-Zugriff:** Freigegebene Administratoren können auf Moderations- und Betriebsdaten zugreifen, die nötig sind, um Community-Inhalte zu prüfen, gemeldete Probleme zu untersuchen und öffentliche Hinweise zu verwalten.\n\n**Analytik:** Wir verwenden Cloudflare Web Analytics. Dabei werden keine Marketing-Cookies genutzt und keine personenbezogenen Analyseprofile erstellt. Wir betrachten nur aggregierte Traffic- und Leistungsdaten.\n\n**Sitzungen und Sicherheit:** Wir verwenden keine Werbe-Cookies. Wenn Sie sich anmelden, nutzen wir sichere Sitzungs-Cookies, damit die Website Sie angemeldet halten und Ihr Konto schützen kann.\n\n**Kontakt- und Supportnachrichten:** Wenn Sie uns eine E-Mail senden oder einen Kontaktweg nutzen, verarbeiten wir Ihre Angaben nur, um zu antworten, operative Probleme zu untersuchen oder das Verzeichnis korrekt zu halten.\n\n**Drittanbieter-Dienste:** Für die Anmeldung setzen wir Google OAuth ein, für Karten OpenStreetMap. Affiliate-Partner oder externe Dienste, die Sie anklicken, können eigene Datenschutzrichtlinien anwenden.\n\n**Ihre Rechte:** Nach DSGVO können Sie Zugang, Berichtigung, Export oder Löschung der personenbezogenen Daten verlangen, die wir über Sie gespeichert haben. Schreiben Sie für Datenschutzanfragen an privacy@znjan.com und für operative oder Verzeichnisprobleme an info@znjan.com."
  it: "Znjan.com rispetta la tua privacy. Questa policy spiega come gestiamo le informazioni sul sito pubblico e nelle funzioni della community.\n\n**Navigazione pubblica:** Puoi consultare guide, luoghi, aree della spiaggia e informazioni sull'accesso sportivo senza creare un account. Le pagine dedicate allo sport spiegano che le aree sportive pubbliche sono gratuite, che al momento non esiste un sistema di prenotazione e che tutto funziona in base al principio del primo arrivato, primo servito.\n\n**Account e accesso:** Se accedi con Google, conserviamo solo i dati minimi necessari per far funzionare la community, come indirizzo email, nome visualizzato, identificatore Google e record di sessione sicuri.\n\n**Contenuti della community:** Post, commenti, nomi profilo pubblici e altri segnali di partecipazione fanno parte di un prodotto community pubblico. Non pubblicare informazioni che vuoi mantenere private.\n\n**Moderazione e accesso admin:** Gli amministratori approvati possono accedere ai dati di moderazione e operativi necessari per rivedere i contenuti della community, indagare problemi segnalati e gestire avvisi pubblici.\n\n**Analytics:** Utilizziamo Cloudflare Web Analytics, che non usa cookie di marketing e non crea profili analitici riconducibili alla persona. Consultiamo solo dati aggregati di traffico e prestazioni.\n\n**Sessioni e sicurezza:** Non utilizziamo cookie pubblicitari. Se accedi, usiamo cookie di sessione sicuri così il sito può mantenerti autenticato e proteggere il tuo account.\n\n**Messaggi di contatto e supporto:** Se ci scrivi via email o usi un canale di contatto, trattiamo le informazioni inviate solo per rispondere, indagare un problema operativo o mantenere accurato il directory.\n\n**Servizi di terze parti:** Per l'accesso utilizziamo Google OAuth e per le mappe OpenStreetMap. Partner affiliati o servizi esterni che apri possono applicare le proprie policy privacy.\n\n**I tuoi diritti:** Ai sensi del GDPR puoi richiedere accesso, correzione, esportazione o cancellazione dei dati personali che conserviamo su di te. Contatta privacy@znjan.com per richieste privacy oppure info@znjan.com per problemi operativi o del directory."
  fr: "Znjan.com respecte votre vie privée. Cette politique explique comment nous traitons les informations sur le site public et dans les fonctionnalités communautaires.\n\n**Navigation publique :** Vous pouvez consulter les guides, les lieux, les zones de plage et les informations sur l'accès sportif sans créer de compte. Les pages dédiées au sport précisent que les espaces sportifs publics sont gratuits, qu'aucun système de réservation n'existe actuellement et que tout fonctionne selon le principe du premier arrivé, premier servi.\n\n**Compte et connexion :** Si vous vous connectez avec Google, nous conservons uniquement les données de compte indispensables au fonctionnement de la communauté, comme votre adresse e-mail, votre nom affiché, l'identifiant Google et des enregistrements de session sécurisés.\n\n**Contenu communautaire :** Les publications, les commentaires, les noms de profil publics et autres signaux de participation font partie d'un produit communautaire public. Ne publiez pas d'informations que vous souhaitez garder privées.\n\n**Modération et accès administrateur :** Les administrateurs autorisés peuvent accéder aux données de modération et opérationnelles nécessaires pour examiner le contenu de la communauté, enquêter sur les problèmes signalés et gérer les annonces publiques.\n\n**Analytique :** Nous utilisons Cloudflare Web Analytics, qui n'emploie pas de cookies marketing et ne crée pas de profils analytiques permettant d'identifier une personne. Nous consultons uniquement des données de trafic et de performance agrégées.\n\n**Sessions et sécurité :** Nous n'utilisons pas de cookies publicitaires. Si vous vous connectez, nous utilisons des cookies de session sécurisés afin que le site puisse vous maintenir connecté et protéger votre compte.\n\n**Messages de contact et d'assistance :** Si vous nous écrivez par e-mail ou utilisez un canal de contact, nous traitons les informations que vous envoyez uniquement pour vous répondre, examiner un problème opérationnel ou maintenir l'annuaire à jour.\n\n**Services tiers :** Nous nous appuyons sur Google OAuth pour la connexion et sur OpenStreetMap pour les cartes. Les partenaires affiliés ou les services externes sur lesquels vous cliquez peuvent appliquer leurs propres politiques de confidentialité.\n\n**Vos droits :** Conformément au RGPD, vous pouvez demander l'accès, la rectification, l'exportation ou la suppression des données personnelles que nous détenons à votre sujet. Contactez privacy@znjan.com pour les demandes de confidentialité ou info@znjan.com pour les questions opérationnelles et d'annuaire."
  es: "Znjan.com respeta tu privacidad. Esta política explica cómo tratamos la información en el sitio público y en las funciones de la comunidad.\n\n**Navegación pública:** Puedes consultar guías, lugares, zonas de playa e información sobre el acceso deportivo sin crear una cuenta. Las páginas de acceso deportivo explican que las áreas deportivas públicas son gratuitas, que actualmente no existe un sistema de reservas y que todo funciona por orden de llegada.\n\n**Cuentas e inicio de sesión:** Si inicias sesión con Google, almacenamos solo los datos de cuenta mínimos necesarios para que funcione la comunidad, como tu dirección de correo electrónico, el nombre visible, el identificador de Google y registros de sesión seguros.\n\n**Contenido de la comunidad:** Las publicaciones, los comentarios, los nombres de perfil públicos y otras señales de participación forman parte de un producto comunitario público. No publiques información que quieras mantener privada.\n\n**Moderación y acceso de administradores:** Los administradores aprobados pueden acceder a los datos de moderación y operativos necesarios para revisar el contenido de la comunidad, investigar los problemas reportados y gestionar los avisos públicos.\n\n**Analítica:** Usamos Cloudflare Web Analytics, que no utiliza cookies de marketing ni crea perfiles analíticos que identifiquen a la persona. Solo revisamos datos agregados de tráfico y rendimiento.\n\n**Sesiones y seguridad:** No utilizamos cookies publicitarias. Si inicias sesión, usamos cookies de sesión seguras para que el sitio pueda mantenerte conectado y proteger tu cuenta.\n\n**Mensajes de contacto y soporte:** Si nos escribes por correo electrónico o usas un canal de contacto, tratamos la información que envías únicamente para responderte, investigar un problema operativo o mantener el directorio actualizado.\n\n**Servicios de terceros:** Utilizamos Google OAuth para el inicio de sesión y OpenStreetMap para los mapas. Los socios afiliados o los servicios externos en los que hagas clic pueden aplicar sus propias políticas de privacidad.\n\n**Tus derechos:** Conforme al RGPD, puedes solicitar el acceso, la rectificación, la exportación o la eliminación de los datos personales que conservamos sobre ti. Escribe a privacy@znjan.com para solicitudes de privacidad o a info@znjan.com para cuestiones operativas y del directorio."
  pl: "Znjan.com szanuje Twoją prywatność. Niniejsza polityka wyjaśnia, jak przetwarzamy informacje na publicznej stronie internetowej oraz w funkcjach społecznościowych.\n\n**Przeglądanie publiczne:** Możesz przeglądać przewodniki, miejsca, strefy plaży oraz informacje o dostępie do obiektów sportowych bez zakładania konta. Strony dotyczące dostępu sportowego wyjaśniają, że publiczne strefy sportowe są bezpłatne, że obecnie nie ma systemu rezerwacji i że obowiązuje zasada „kto pierwszy, ten lepszy”.\n\n**Konta i logowanie:** Jeśli zalogujesz się przez Google, przechowujemy tylko minimalne dane konta niezbędne do działania społeczności, takie jak adres e-mail, nazwa wyświetlana, identyfikator Google oraz bezpieczne zapisy sesji.\n\n**Treści społecznościowe:** Posty, komentarze, publiczne nazwy profili i inne sygnały aktywności są częścią publicznego produktu społecznościowego. Nie publikuj informacji, które chcesz zachować w tajemnicy.\n\n**Moderacja i dostęp administratorów:** Zatwierdzeni administratorzy mogą uzyskać dostęp do danych moderacyjnych i operacyjnych potrzebnych do przeglądania treści społeczności, badania zgłoszonych problemów oraz zarządzania publicznymi komunikatami.\n\n**Analityka:** Korzystamy z Cloudflare Web Analytics, które nie używa plików cookie marketingowych ani nie tworzy profili analitycznych umożliwiających identyfikację osoby. Przeglądamy wyłącznie zagregowane dane o ruchu i wydajności.\n\n**Sesje i bezpieczeństwo:** Nie używamy reklamowych plików cookie. Jeśli się zalogujesz, stosujemy bezpieczne pliki cookie sesji, aby strona mogła utrzymać Cię w stanie zalogowania i chronić Twoje konto.\n\n**Wiadomości kontaktowe i pomoc:** Jeśli napiszesz do nas e-mail lub skorzystasz z kanału kontaktowego, przetwarzamy przesłane informacje wyłącznie w celu udzielenia odpowiedzi, zbadania problemu operacyjnego lub utrzymania aktualności katalogu.\n\n**Usługi zewnętrzne:** Do logowania wykorzystujemy Google OAuth, a do map OpenStreetMap. Partnerzy afiliacyjni lub usługi zewnętrzne, które klikniesz, mogą stosować własne polityki prywatności.\n\n**Twoje prawa:** Zgodnie z RODO możesz zażądać dostępu do swoich danych osobowych, ich sprostowania, eksportu lub usunięcia. W sprawach prywatności pisz na privacy@znjan.com, a w kwestiach operacyjnych i katalogowych na info@znjan.com."
  nl: "Znjan.com respecteert uw privacy. Dit beleid legt uit hoe wij omgaan met informatie op de openbare website en in de communityfuncties.\n\n**Openbaar browsen:** U kunt gidsen, locaties, strandzones en informatie over sporttoegang bekijken zonder een account aan te maken. De pagina's over sporttoegang leggen uit dat de openbare sportzones gratis te gebruiken zijn, dat er momenteel geen reserveringssysteem is en dat alles werkt volgens het principe wie het eerst komt, het eerst maalt.\n\n**Accounts en inloggen:** Als u inlogt met Google, bewaren wij alleen de accountgegevens die minimaal nodig zijn om de community te laten werken, zoals uw e-mailadres, weergavenaam, Google-identificatie en beveiligde sessiegegevens.\n\n**Community-inhoud:** Berichten, reacties, openbare profielnamen en andere deelnamesignalen maken deel uit van een openbaar communityproduct. Plaats geen informatie die u privé wilt houden.\n\n**Moderatie en admintoegang:** Goedgekeurde beheerders kunnen toegang krijgen tot de moderatie- en operationele gegevens die nodig zijn om community-inhoud te beoordelen, gemelde problemen te onderzoeken en openbare updates te beheren.\n\n**Analytics:** Wij gebruiken Cloudflare Web Analytics, dat geen marketingcookies gebruikt en geen tot een persoon herleidbare analyseprofielen aanmaakt. Wij bekijken alleen geaggregeerde verkeers- en prestatiegegevens.\n\n**Sessies en beveiliging:** Wij gebruiken geen advertentiecookies. Als u inlogt, gebruiken wij beveiligde sessiecookies zodat de website u ingelogd kan houden en uw account kan beschermen.\n\n**Contact- en supportberichten:** Als u ons een e-mail stuurt of een contactkanaal gebruikt, verwerken wij de verzonden informatie uitsluitend om te reageren, een operationeel probleem te onderzoeken of de directory accuraat te houden.\n\n**Diensten van derden:** Voor het inloggen vertrouwen wij op Google OAuth en voor kaarten op OpenStreetMap. Aangesloten partners of externe diensten waarop u klikt, kunnen hun eigen privacybeleid toepassen.\n\n**Uw rechten:** Op grond van de AVG kunt u verzoeken om inzage, correctie, export of verwijdering van de persoonsgegevens die wij over u bewaren. Neem voor privacyverzoeken contact op via privacy@znjan.com of voor operationele en directorykwesties via info@znjan.com."
