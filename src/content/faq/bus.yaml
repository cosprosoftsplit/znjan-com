id: bus-to-znjan
question:
  en: "How do I get to Žnjan Beach by bus?"
  hr: "Kako doći do plaže Žnjan autobusom?"
  de: "Wie komme ich mit dem Bus zum Strand Žnjan?"
  it: "Come arrivo alla spiaggia di Žnjan in autobus?"
  fr: "Comment se rendre à la plage de Žnjan en bus ?"
  es: "¿Cómo llegar a la playa de Žnjan en autobús?"
  pl: "Jak dojechać na plażę Žnjan autobusem?"
  nl: "Hoe kom ik met de bus naar het strand van Žnjan?"
answer:
  en: "Take bus line 8 or line 15 from Split city centre. The ride takes approximately 15–20 minutes. Get off at the Žnjan stop — the beach is immediately visible. Buses run frequently during summer season. You can also take an Uber or Bolt from the Old Town for approximately €6–9."
  hr: "Iz centra Splita do plaže voze autobusi linija 8 i 15. Vožnja traje približno 15–20 minuta. Siđite na stanici Žnjan — plaža je odmah vidljiva. Autobusi voze često tijekom ljetne sezone. Također možete koristiti Uber ili Bolt iz Staroga grada za otprilike 6–9€."
  de: "Nehmen Sie die Buslinie 8 oder 15 aus dem Stadtzentrum von Split. Die Fahrt dauert etwa 15–20 Minuten. Steigen Sie an der Haltestelle Žnjan aus — der Strand ist sofort sichtbar. Busse fahren in der Sommersaison häufig. Sie können auch Uber oder Bolt aus der Altstadt für ca. 6–9€ nehmen."
  it: "Prendete l'autobus linea 8 o linea 15 dal centro di Spalato. Il viaggio dura circa 15-20 minuti. Scendete alla fermata Žnjan — la spiaggia è immediatamente visibile. Gli autobus passano frequentemente durante la stagione estiva. Potete anche prendere un Uber o Bolt dal centro storico per circa 6-9€."
  fr: "Prenez la ligne de bus 8 ou 15 depuis le centre-ville de Split. Le trajet dure environ 15 à 20 minutes. Descendez à l'arrêt Žnjan — la plage est juste devant vous. Les bus circulent fréquemment en haute saison estivale. Vous pouvez aussi prendre un Uber ou un Bolt depuis la vieille ville pour environ 6 à 9 €."
  es: "Toma la línea de autobús 8 o 15 desde el centro de Split. El trayecto dura unos 15-20 minutos. Bájate en la parada de Žnjan: la playa queda justo enfrente. Los autobuses pasan con frecuencia durante la temporada de verano. También puedes pedir un Uber o un Bolt desde el casco antiguo por unos 6-9 €."
  pl: "Wsiądź do autobusu linii 8 lub 15 z centrum Splitu. Przejazd trwa około 15–20 minut. Wysiądź na przystanku Žnjan — plaża jest tuż przed Tobą. Autobusy kursują często w sezonie letnim. Możesz też zamówić Ubera lub Bolta ze starego miasta za około 6–9 €."
  nl: "Neem buslijn 8 of 15 vanuit het centrum van Split. De rit duurt ongeveer 15 tot 20 minuten. Stap uit bij de halte Žnjan — het strand ligt meteen voor je. In het zomerseizoen rijden de bussen frequent. Je kunt ook een Uber of Bolt nemen vanuit de oude stad voor ongeveer 6 tot 9 €."
