id: hotels-near-znjan
question:
  en: "What hotels are near Žnjan Beach?"
  hr: "Koji hoteli se nalaze u blizini plaže Žnjan?"
  de: "Welche Hotels befinden sich in der Nähe des Strandes Žnjan?"
  it: "Quali hotel si trovano vicino alla spiaggia di Žnjan?"
  fr: "Quels hôtels se trouvent près de la plage de Žnjan ?"
  es: "¿Qué hoteles hay cerca de la playa de Žnjan?"
  pl: "Jakie hotele znajdują się w pobliżu plaży Žnjan?"
  nl: "Welke hotels liggen er in de buurt van het strand van Žnjan?"
answer:
  en: "Several hotels are within walking distance: Radisson Blu Resort & Spa (4-star, 252 rooms, 2,600m² spa), Hotel Amphora (4-star, 206 rooms, pools), Hotel Olivier (4-star boutique, 22 rooms), and Hotel More (3-star family-run, 11 rooms on the promenade). The Mövenpick Hotel Žnjan — Croatia's first Mövenpick — is opening in 2026 with 156 rooms and a rooftop infinity pool."
  hr: "Nekoliko hotela je na pješačkoj udaljenosti: Radisson Blu Resort & Spa (4 zvjezdice, 252 sobe, spa 2.600 m²), Hotel Amphora (4 zvjezdice, 206 soba, bazeni), Hotel Olivier (4 zvjezdice boutique, 22 sobe) i Hotel More (3 zvjezdice obiteljski, 11 soba na šetnici). Mövenpick Hotel Žnjan — prvi Mövenpick u Hrvatskoj — otvara se 2026. sa 156 soba i krovnim infinity bazenom."
  de: "Mehrere Hotels sind fußläufig erreichbar: Radisson Blu Resort & Spa (4 Sterne, 252 Zimmer, 2.600 m² Spa), Hotel Amphora (4 Sterne, 206 Zimmer, Pools), Hotel Olivier (4 Sterne Boutique, 22 Zimmer) und Hotel More (3 Sterne Familienhotel, 11 Zimmer an der Promenade). Das Mövenpick Hotel Žnjan — Kroatiens erstes Mövenpick — eröffnet 2026 mit 156 Zimmern und Rooftop-Infinity-Pool."
  it: "Diversi hotel sono raggiungibili a piedi: Radisson Blu Resort & Spa (4 stelle, 252 camere, spa 2.600 m²), Hotel Amphora (4 stelle, 206 camere, piscine), Hotel Olivier (4 stelle boutique, 22 camere) e Hotel More (3 stelle familiare, 11 camere sul lungomare). Il Mövenpick Hotel Žnjan — il primo Mövenpick della Croazia — aprirà nel 2026 con 156 camere e piscina infinity sul tetto."
  fr: "Plusieurs hôtels sont accessibles à pied : le Radisson Blu Resort & Spa (4 étoiles, 252 chambres, spa de 2 600 m²), l'Hôtel Amphora (4 étoiles, 206 chambres, piscines), l'Hôtel Olivier (boutique 4 étoiles, 22 chambres) et l'Hôtel More (3 étoiles, familial, 11 chambres sur la promenade). Le Mövenpick Hotel Žnjan — le premier Mövenpick de Croatie — ouvrira en 2026 avec 156 chambres et une piscine à débordement sur le toit."
  es: "Varios hoteles están a poca distancia a pie: Radisson Blu Resort & Spa (4 estrellas, 252 habitaciones, spa de 2.600 m²), Hotel Amphora (4 estrellas, 206 habitaciones, piscinas), Hotel Olivier (boutique de 4 estrellas, 22 habitaciones) y Hotel More (3 estrellas, de gestión familiar, 11 habitaciones en el paseo marítimo). El Mövenpick Hotel Žnjan —el primer Mövenpick de Croacia— abrirá en 2026 con 156 habitaciones y una piscina infinita en la azotea."
  pl: "Kilka hoteli znajduje się w odległości spaceru: Radisson Blu Resort & Spa (4 gwiazdki, 252 pokoje, spa o powierzchni 2600 m²), Hotel Amphora (4 gwiazdki, 206 pokoi, baseny), Hotel Olivier (4-gwiazdkowy butikowy, 22 pokoje) oraz Hotel More (3 gwiazdki, rodzinny, 11 pokoi przy promenadzie). Mövenpick Hotel Žnjan — pierwszy Mövenpick w Chorwacji — zostanie otwarty w 2026 roku ze 156 pokojami i basenem infinity na dachu."
  nl: "Verschillende hotels liggen op loopafstand: Radisson Blu Resort & Spa (4 sterren, 252 kamers, spa van 2.600 m²), Hotel Amphora (4 sterren, 206 kamers, zwembaden), Hotel Olivier (4-sterren boutique, 22 kamers) en Hotel More (3 sterren, familiaal, 11 kamers aan de promenade). Het Mövenpick Hotel Žnjan — het eerste Mövenpick van Kroatië — opent in 2026 met 156 kamers en een infinitypool op het dak."
