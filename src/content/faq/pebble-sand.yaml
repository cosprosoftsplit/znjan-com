id: pebble-or-sand
question:
  en: "Is Žnjan Beach sand or pebble?"
  hr: "Je li plaža Žnjan pješčana ili šljunčana?"
  de: "Ist der Strand Žnjan ein Sand- oder Kieselstrand?"
  it: "La spiaggia di Žnjan è di sabbia o ciottoli?"
  fr: "La plage de Žnjan est-elle de sable ou de galets ?"
  es: "¿La playa de Žnjan es de arena o de guijarros?"
  pl: "Czy plaża Žnjan jest piaszczysta czy kamienista?"
  nl: "Is het strand van Žnjan zand of kiezel?"
answer:
  en: "Žnjan Beach is a pebble beach with small, smooth stones. It's comfortable to walk on but water shoes are recommended for the most enjoyable experience, especially for children. The advantage of pebble beaches is that the water stays crystal clear — no sand to cloud it. Some areas near the kids' zones have finer gravel for more comfort."
  hr: "Plaža Žnjan je šljunčana plaža s malim, glatkim kamenčićima. Ugodno je hodati po njoj, ali se preporučuju cipele za vodu za najugodnije iskustvo, posebno za djecu. Prednost šljunčanih plaža je kristalno čisto more — nema pijeska koji bi ga zamutio. Neka područja blizu dječjih zona imaju finiji šljunak za veću udobnost."
  de: "Der Strand Žnjan ist ein Kieselstrand mit kleinen, glatten Steinen. Es ist angenehm darauf zu gehen, aber Badeschuhe werden für das angenehmste Erlebnis empfohlen, besonders für Kinder. Der Vorteil von Kieselstränden ist, dass das Wasser kristallklar bleibt — kein Sand, der es trübt. Einige Bereiche in der Nähe der Kinderzonen haben feineren Kies für mehr Komfort."
  it: "La spiaggia di Žnjan è una spiaggia di ciottoli con piccole pietre lisce. È comodo camminarci sopra, ma si consigliano scarpe da acqua per la migliore esperienza, soprattutto per i bambini. Il vantaggio delle spiagge di ciottoli è che l'acqua resta cristallina — nessuna sabbia a intorbidirla. Alcune zone vicino alle aree bambini hanno ghiaia più fine per maggiore comfort."
  fr: "La plage de Žnjan est une plage de galets aux petits cailloux lisses. La marche y est agréable, mais des chaussures d'eau sont recommandées pour profiter au maximum, surtout pour les enfants. L'avantage des plages de galets, c'est que l'eau reste parfaitement limpide — aucun sable pour la troubler. Certaines zones près des espaces enfants offrent des graviers plus fins pour un meilleur confort."
  es: "La playa de Žnjan es una playa de guijarros con piedras pequeñas y lisas. Resulta cómoda para caminar, aunque se recomienda usar escarpines para disfrutarla al máximo, sobre todo con niños. La ventaja de las playas de guijarros es que el agua se mantiene cristalina, sin arena que la enturbie. Algunas zonas cercanas a las áreas infantiles cuentan con grava más fina para mayor comodidad."
  pl: "Plaża Žnjan to plaża kamienista z drobnymi, gładkimi otoczakami. Chodzenie po niej jest wygodne, ale dla największego komfortu warto mieć buty do wody, zwłaszcza w przypadku dzieci. Zaletą plaż kamienistych jest krystalicznie czysta woda — bez piasku, który mógłby ją zmącić. Niektóre miejsca w pobliżu stref dla dzieci pokryte są drobniejszym żwirem dla większej wygody."
  nl: "Het strand van Žnjan is een kiezelstrand met kleine, gladde steentjes. Het loopt comfortabel, maar waterschoenen worden aangeraden om er optimaal van te genieten, zeker voor kinderen. Het voordeel van kiezelstranden is dat het water kristalhelder blijft — geen zand dat het troebel maakt. Sommige plekken bij de kinderzones hebben fijner grind voor extra comfort."
