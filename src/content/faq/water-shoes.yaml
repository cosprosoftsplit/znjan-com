id: water-shoes
question:
  en: "Do I need water shoes at Žnjan Beach?"
  hr: "Trebam li cipele za vodu na plaži Žnjan?"
  de: "Brauche ich Wasserschuhe am Strand Žnjan?"
  it: "Servono le scarpette da scoglio alla spiaggia di Žnjan?"
  fr: "Ai-je besoin de chaussures d'eau à la plage de Žnjan ?"
  es: "¿Necesito escarpines en la playa de Žnjan?"
  pl: "Czy na plaży Žnjan potrzebuję butów do wody?"
  nl: "Heb ik waterschoenen nodig op het strand van Žnjan?"
answer:
  en: "Yes, water shoes are strongly recommended. Žnjan is a pebble beach with small stones that can be uncomfortable to walk on barefoot, and sea urchins are occasionally present in the water. Rubber sandals or water shoes make walking and swimming much more comfortable."
  hr: "Da, cipele za vodu se toplo preporučuju. Žnjan je šljunčana plaža s kamenčićima po kojima je neugodno hodati bos, a u moru povremeno ima morskih ježeva. Gumene sandale ili cipele za vodu znatno olakšavaju hodanje i plivanje."
  de: "Ja, Wasserschuhe werden dringend empfohlen. Žnjan ist ein Kieselstrand mit kleinen Steinen, auf denen das Barfußlaufen unangenehm sein kann, und gelegentlich sind Seeigel im Wasser vorhanden. Gummisandalen oder Wasserschuhe machen das Gehen und Schwimmen deutlich angenehmer."
  it: "Sì, le scarpette da scoglio sono fortemente consigliate. Žnjan è una spiaggia di ciottoli con sassolini su cui è scomodo camminare a piedi nudi, e occasionalmente ci sono ricci di mare in acqua. Sandali di gomma o scarpette da scoglio rendono molto più comodo camminare e nuotare."
  fr: "Oui, les chaussures d'eau sont vivement recommandées. Žnjan est une plage de galets dont les petits cailloux rendent la marche pieds nus inconfortable, et des oursins sont parfois présents dans l'eau. Des sandales en caoutchouc ou des chaussures d'eau rendent la marche et la baignade bien plus agréables."
  es: "Sí, los escarpines son muy recomendables. Žnjan es una playa de guijarros con piedrecitas sobre las que resulta incómodo caminar descalzo, y de vez en cuando hay erizos de mar en el agua. Las sandalias de goma o los escarpines hacen que caminar y nadar resulte mucho más cómodo."
  pl: "Tak, buty do wody są zdecydowanie zalecane. Žnjan to żwirowa plaża z drobnymi kamykami, po których chodzenie boso bywa niewygodne, a w wodzie czasami pojawiają się jeżowce. Gumowe sandały lub buty do wody sprawiają, że chodzenie i pływanie staje się znacznie wygodniejsze."
  nl: "Ja, waterschoenen worden sterk aanbevolen. Žnjan is een kiezelstrand met steentjes waarop blootsvoets lopen ongemakkelijk kan zijn, en af en toe zwemmen er zee-egels in het water. Rubberen sandalen of waterschoenen maken het lopen en zwemmen een stuk aangenamer."
