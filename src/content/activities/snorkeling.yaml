description:
  en: "Discover the underwater world along Žnjan Beach. The rocky sections near the sports zone and the edges of the beach offer great snorkeling with clear visibility. Spot sea urchins, small fish, and colorful marine life in the shallow Adriatic waters."
  hr: "Otkrijte podvodni svijet uz plažu Žnjan. Kameniti dijelovi blizu sportske zone i rubovi plaže nude odlično ronjenje s maskom uz dobru vidljivost. Uočite morske ježeve, male ribe i šareni morski život u plitkim vodama Jadrana."
  de: "Entdecken Sie die Unterwasserwelt entlang des Strandes Žnjan. Die felsigen Abschnitte in der Nähe der Sportzone und die Ränder des Strandes bieten großartiges Schnorcheln mit klarer Sicht. Entdecken Sie Seeigel, kleine Fische und buntes Meeresleben im flachen Adriawasser."
  it: "Scopri il mondo sottomarino lungo la spiaggia di Žnjan. Le sezioni rocciose vicino alla zona sportiva e i bordi della spiaggia offrono un ottimo snorkeling con buona visibilità. Osserva ricci di mare, pesciolini e la colorata vita marina nelle acque poco profonde dell'Adriatico."
  fr: "Partez à la découverte des fonds marins le long de la plage de Žnjan. Les zones rocheuses près de l'espace sportif et les bords de la plage offrent un cadre idéal pour le snorkeling, avec une excellente visibilité. Observez oursins, petits poissons et une vie marine colorée dans les eaux peu profondes de l'Adriatique."
  es: "Descubre el mundo submarino a lo largo de la playa de Žnjan. Las zonas rocosas cercanas al área deportiva y los extremos de la playa ofrecen un snorkel excelente con gran visibilidad. Observa erizos de mar, pececillos y una colorida vida marina en las aguas poco profundas del Adriático."
  pl: "Odkryj podwodny świat wzdłuż plaży Žnjan. Skaliste odcinki przy strefie sportowej oraz krańce plaży zapewniają znakomite warunki do snurkowania przy świetnej widoczności. Wypatruj jeżowców, małych ryb i barwnego życia morskiego w płytkich wodach Adriatyku."
  nl: "Ontdek de onderwaterwereld langs het strand van Žnjan. De rotsachtige stukken bij de sportzone en de randen van het strand bieden uitstekend snorkelen met helder zicht. Spot zee-egels, kleine visjes en kleurrijk zeeleven in de ondiepe wateren van de Adriatische Zee."
