id: water-depth
question:
  en: "How deep is the water at Žnjan Beach?"
  hr: "Koliko je duboko more na plaži Žnjan?"
  de: "Wie tief ist das Wasser am Strand Žnjan?"
  it: "Quanto è profonda l'acqua alla spiaggia di Žnjan?"
  fr: "Quelle est la profondeur de l'eau à la plage de Žnjan ?"
  es: "¿Qué profundidad tiene el agua en la playa de Žnjan?"
  pl: "Jak głęboka jest woda na plaży Žnjan?"
  nl: "Hoe diep is het water bij het strand van Žnjan?"
answer:
  en: "The water depth varies by section. The main beach has a gradual entry that gets waist-deep within a few metres. The dedicated kids' zone has very shallow, gentle water. However, in some areas the sea gets deep relatively quickly — non-swimmers should stay close to shore. The eastern rocky section is deeper near the rocks."
  hr: "Dubina vode varira po dijelovima plaže. Glavna plaža ima postupni ulaz koji doseže dubinu do struka unutar nekoliko metara. Posebna dječja zona ima vrlo plitku i mirnu vodu. Međutim, na nekim dijelovima more brzo postaje duboko — neplivači bi trebali ostati blizu obale. Istočni stjenoviti dio je dublji uz stijene."
  de: "Die Wassertiefe variiert je nach Abschnitt. Der Hauptstrand hat einen sanften Einstieg, der innerhalb weniger Meter hüfttief wird. Die Kinderzone hat sehr flaches, ruhiges Wasser. In einigen Bereichen wird das Meer jedoch relativ schnell tief — Nichtschwimmer sollten in Ufernähe bleiben. Der felsige östliche Abschnitt ist in Felsnähe tiefer."
  it: "La profondità dell'acqua varia a seconda della zona. La spiaggia principale ha un ingresso graduale che raggiunge la profondità della vita in pochi metri. La zona dedicata ai bambini ha acqua molto bassa e calma. Tuttavia, in alcune aree il mare diventa profondo abbastanza rapidamente — chi non sa nuotare dovrebbe restare vicino alla riva. La sezione rocciosa orientale è più profonda vicino alle rocce."
  fr: "La profondeur de l'eau varie selon les zones. La plage principale offre une entrée progressive qui atteint la hauteur de la taille en quelques mètres. La zone réservée aux enfants présente une eau très peu profonde et calme. Toutefois, dans certains secteurs, la mer devient profonde assez rapidement — les non-nageurs ont intérêt à rester près du rivage. La section rocheuse à l'est est plus profonde près des rochers."
  es: "La profundidad del agua varía según la zona. La playa principal tiene una entrada gradual que alcanza la altura de la cintura en pocos metros. La zona infantil cuenta con aguas muy poco profundas y tranquilas. Sin embargo, en algunas áreas el mar se hace profundo con bastante rapidez: quienes no sepan nadar deberían quedarse cerca de la orilla. El tramo rocoso del este es más profundo junto a las rocas."
  pl: "Głębokość wody różni się w zależności od sekcji plaży. Plaża główna ma łagodne wejście, które w ciągu kilku metrów sięga do pasa. Wydzielona strefa dla dzieci oferuje bardzo płytką i spokojną wodę. W niektórych miejscach morze robi się jednak głębokie stosunkowo szybko — osoby nieumiejące pływać powinny trzymać się blisko brzegu. Skalisty wschodni odcinek jest głębszy przy skałach."
  nl: "De waterdiepte verschilt per gedeelte. Het hoofdstrand heeft een geleidelijke instap die binnen enkele meters tot heuphoogte komt. De aparte kinderzone heeft heel ondiep en rustig water. In sommige delen wordt de zee echter vrij snel diep — niet-zwemmers kunnen het beste dicht bij de kust blijven. Het rotsachtige oostelijke gedeelte is dieper bij de rotsen."
