id: clean-water
question:
  en: "Is the water clean at Žnjan Beach?"
  hr: "Je li more čisto na plaži Žnjan?"
  de: "Ist das Wasser am Strand Žnjan sauber?"
  it: "L'acqua è pulita alla spiaggia di Žnjan?"
  fr: "L'eau est-elle propre à la plage de Žnjan ?"
  es: "¿Está limpia el agua en la playa de Žnjan?"
  pl: "Czy woda na plaży Žnjan jest czysta?"
  nl: "Is het water schoon bij het strand van Žnjan?"
answer:
  en: "Yes, the water at Žnjan is very clean. The €45.77M renovation included a completely new sewage system that resolved previous water quality issues. The Adriatic water is crystal clear — especially at the rocky eastern end, which is excellent for snorkeling. Pebble beaches generally have clearer water than sandy ones since there's no sand to stir up."
  hr: "Da, more na Žnjanu je vrlo čisto. Renovacija od 45,77 milijuna eura uključila je potpuno novi kanalizacijski sustav koji je riješio prijašnje probleme s kvalitetom vode. Jadransko more je kristalno čisto — osobito na stjenovitom istočnom dijelu, koji je odličan za ronjenje s maskom. Šljunčane plaže općenito imaju čišću vodu od pješčanih jer nema pijeska koji se diže."
  de: "Ja, das Wasser am Žnjan ist sehr sauber. Die 45,77-Millionen-Euro-Renovierung umfasste ein komplett neues Abwassersystem, das frühere Wasserqualitätsprobleme behoben hat. Das Adriawasser ist kristallklar — besonders am felsigen östlichen Ende, das hervorragend zum Schnorcheln geeignet ist. Kiesstrände haben generell klareres Wasser als Sandstrände, da kein Sand aufgewirbelt wird."
  it: "Sì, l'acqua a Žnjan è molto pulita. La ristrutturazione da €45,77 milioni ha incluso un sistema fognario completamente nuovo che ha risolto i precedenti problemi di qualità dell'acqua. L'acqua dell'Adriatico è cristallina — soprattutto nell'estremità rocciosa orientale, eccellente per lo snorkeling. Le spiagge di ciottoli hanno generalmente acqua più limpida di quelle sabbiose poiché non c'è sabbia da sollevare."
  fr: "Oui, l'eau de Žnjan est très propre. La rénovation de 45,77 M€ a intégré un réseau d'assainissement entièrement neuf qui a résolu les anciens problèmes de qualité de l'eau. L'eau de l'Adriatique est d'une transparence cristalline — surtout à l'extrémité rocheuse à l'est, idéale pour la plongée avec masque et tuba. Les plages de galets offrent généralement une eau plus claire que les plages de sable, car il n'y a pas de sable remué."
  es: "Sí, el agua de Žnjan es muy limpia. La renovación de 45,77 M€ incluyó un sistema de alcantarillado completamente nuevo que resolvió los problemas previos de calidad del agua. El agua del Adriático es cristalina — sobre todo en el extremo rocoso del este, ideal para hacer snorkel. Las playas de cantos rodados suelen tener el agua más clara que las de arena, ya que no hay arena que se remueva."
  pl: "Tak, woda na Žnjanie jest bardzo czysta. Renowacja za 45,77 mln € objęła całkowicie nowy system kanalizacyjny, który rozwiązał wcześniejsze problemy z jakością wody. Woda Adriatyku jest krystalicznie czysta — zwłaszcza przy skalistym, wschodnim krańcu, świetnym do snorkelingu. Plaże kamieniste mają na ogół czystszą wodę niż piaszczyste, ponieważ nie ma piasku, który mógłby się unosić."
  nl: "Ja, het water bij Žnjan is heel schoon. De renovatie van 45,77 miljoen euro omvatte een compleet nieuw rioleringssysteem dat eerdere problemen met de waterkwaliteit heeft opgelost. Het water van de Adriatische Zee is kristalhelder — vooral aan het rotsachtige oostelijke uiteinde, dat uitstekend is om te snorkelen. Kiezelstranden hebben doorgaans helderder water dan zandstranden, omdat er geen zand wordt opgewerveld."
