id: transformation
question:
  en: "What was the €45.77M Žnjan Beach transformation?"
  hr: "Što je bila transformacija plaže Žnjan od 45,77 milijuna eura?"
  de: "Was war die 45,77-Millionen-Euro-Transformation des Strandes Žnjan?"
  it: "Cos'è stata la trasformazione da €45,77 milioni della spiaggia di Žnjan?"
  fr: "En quoi a consisté la transformation à 45,77 M€ de la plage de Žnjan ?"
  es: "¿En qué consistió la transformación de 45,77 M€ de la playa de Žnjan?"
  pl: "Na czym polegała transformacja plaży Žnjan za 45,77 mln euro?"
  nl: "Wat hield de transformatie van 45,77 miljoen euro van het strand van Žnjan in?"
answer:
  en: "Reopened on June 21, 2025, the €45.77M transformation (including €13.94M in EU funding) rebuilt Žnjan Beach from the ground up. Designed by architect Ante Kuzmanić and built by Lavčević d.d., it includes 11 new pavilion buildings, a two-level underground garage (530 spaces), 451 outdoor parking spaces, a 2+ km promenade, an amphitheatre with steel dome, ~48,000 m² of green space with 730 trees, and full accessibility features including a hydraulic sea-access elevator. Managed by Žnjan d.o.o. under a 40-year concession, it's earned the nickname 'Miami of Split'."
  hr: "Plaža je ponovo otvorena 21. lipnja 2025. Transformacija od 45,77 milijuna eura (uključujući 13,94 milijuna eura EU sredstava) potpuno je obnovila plažu Žnjan. Po projektu arhitekta Ante Kuzmanića, a gradila je tvrtka Lavčević d.d. Uključuje 11 novih paviljona, podzemnu garažu na dva kata (530 mjesta), 451 vanjsko parkirno mjesto, šetnicu od 2+ km, amfiteatar sa čeličnom kupolom, ~48.000 m² zelenih površina sa 730 stabala i potpunu pristupačnost uključujući hidraulični lift za ulazak u more. Upravlja Žnjan d.o.o. u sklopu 40-godišnje koncesije."
  de: "Am 21. Juni 2025 wiedereröffnet, hat die 45,77-Millionen-Euro-Transformation (einschließlich 13,94 Mio. € EU-Förderung) den Strand Žnjan von Grund auf neu gestaltet. Entworfen von Architekt Ante Kuzmanić und gebaut von Lavčević d.d., umfasst sie 11 neue Pavillongebäude, eine zweistöckige Tiefgarage (530 Plätze), 451 Außenparkplätze, eine 2+ km Promenade, ein Amphitheater mit Stahlkuppel, ~48.000 m² Grünfläche mit 730 Bäumen und volle Barrierefreiheit einschließlich eines hydraulischen Meereszugangslifts. Verwaltet von Žnjan d.o.o. im Rahmen einer 40-jährigen Konzession."
  it: "Riaperta il 21 giugno 2025, la trasformazione da €45,77 milioni (inclusi €13,94 milioni di fondi UE) ha ricostruito la spiaggia di Žnjan dalle fondamenta. Progettata dall'architetto Ante Kuzmanić e costruita da Lavčević d.d., include 11 nuovi padiglioni, un garage sotterraneo a due livelli (530 posti), 451 posti esterni, un lungomare di 2+ km, un anfiteatro con cupola in acciaio, ~48.000 m² di verde con 730 alberi e piena accessibilità incluso un ascensore idraulico per l'accesso al mare. Gestita da Žnjan d.o.o. con concessione quarantennale."
  fr: "Rouverte le 21 juin 2025, la transformation à 45,77 M€ (dont 13,94 M€ de financements européens) a reconstruit la plage de Žnjan de fond en comble. Conçue par l'architecte Ante Kuzmanić et réalisée par Lavčević d.d., elle comprend 11 nouveaux pavillons, un parking souterrain sur deux niveaux (530 places), 451 places de stationnement extérieures, une promenade de plus de 2 km, un amphithéâtre coiffé d'un dôme en acier, environ 48 000 m² d'espaces verts plantés de 730 arbres et une accessibilité intégrale, avec notamment un ascenseur hydraulique d'accès à la mer. Gérée par Žnjan d.o.o. dans le cadre d'une concession de 40 ans, elle a hérité du surnom de « Miami de Split »."
  es: "Reabierta el 21 de junio de 2025, la transformación de 45,77 M€ (incluidos 13,94 M€ de fondos europeos) reconstruyó la playa de Žnjan desde cero. Diseñada por el arquitecto Ante Kuzmanić y ejecutada por Lavčević d.d., incluye 11 nuevos pabellones, un aparcamiento subterráneo de dos plantas (530 plazas), 451 plazas al aire libre, un paseo marítimo de más de 2 km, un anfiteatro con cúpula de acero, unos 48 000 m² de zonas verdes con 730 árboles y plena accesibilidad, con un ascensor hidráulico de acceso al mar. Gestionada por Žnjan d.o.o. mediante una concesión de 40 años, se ha ganado el apodo de «la Miami de Split»."
  pl: "Otwarta ponownie 21 czerwca 2025 roku transformacja za 45,77 mln euro (w tym 13,94 mln euro dofinansowania z UE) odbudowała plażę Žnjan od podstaw. Zaprojektowana przez architekta Ante Kuzmanicia i zrealizowana przez Lavčević d.d., obejmuje 11 nowych pawilonów, dwupoziomowy parking podziemny (530 miejsc), 451 miejsc parkingowych na zewnątrz, ponad 2-kilometrową promenadę, amfiteatr ze stalową kopułą, około 48 000 m² terenów zielonych z 730 drzewami oraz pełną dostępność, w tym hydrauliczną windę umożliwiającą wejście do morza. Zarządzana przez Žnjan d.o.o. w ramach 40-letniej koncesji, zyskała przydomek „Miami Splitu”."
  nl: "Heropend op 21 juni 2025 heeft de transformatie van 45,77 miljoen euro (waarvan 13,94 miljoen euro EU-financiering) het strand van Žnjan volledig opnieuw opgebouwd. Ontworpen door architect Ante Kuzmanić en uitgevoerd door Lavčević d.d., omvat het 11 nieuwe paviljoens, een ondergrondse parkeergarage met twee niveaus (530 plaatsen), 451 buitenparkeerplaatsen, een promenade van ruim 2 km, een amfitheater met stalen koepel, zo'n 48.000 m² groen met 730 bomen en volledige toegankelijkheid, met onder meer een hydraulische lift voor toegang tot de zee. Beheerd door Žnjan d.o.o. onder een concessie van 40 jaar heeft het de bijnaam 'het Miami van Split' gekregen."
