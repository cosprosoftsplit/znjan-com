<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#023e8a"/>
      <stop offset="35%" style="stop-color:#0077B6"/>
      <stop offset="70%" style="stop-color:#0096c7"/>
      <stop offset="100%" style="stop-color:#2d8a9b"/>
    </linearGradient>
    <linearGradient id="sand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F4E8C1"/>
      <stop offset="100%" style="stop-color:#DEB887"/>
    </linearGradient>
    <clipPath id="ogMark"><circle cx="60" cy="60" r="56"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Waves -->
  <path d="M0 400 Q200 360 400 380 Q600 400 800 370 Q1000 340 1200 360 L1200 420 Q900 400 600 380 Q300 360 0 400 Z" fill="#90E0EF" opacity="0.35"/>
  <!-- Sand -->
  <path d="M0 448 Q300 418 600 433 Q900 448 1200 423 L1200 630 L0 630 Z" fill="url(#sand)"/>
  <!-- Wave detail -->
  <path d="M0 438 Q150 423 300 433 Q450 443 600 428 Q750 413 900 426 Q1050 438 1200 418" fill="none" stroke="white" stroke-width="1.5" opacity="0.3"/>
  <!-- Palm silhouettes -->
  <g opacity="0.13" fill="white">
    <path d="M100 448 Q95 388 90 348 Q80 308 60 288 Q90 318 100 348 Q110 318 140 288 Q120 308 110 348 Q105 388 100 448Z"/>
    <path d="M1120 428 Q1115 368 1110 328 Q1100 288 1080 268 Q1110 298 1120 328 Q1130 298 1160 268 Q1140 288 1130 328 Q1125 368 1120 428Z"/>
  </g>

  <!-- Žnjan "Horizon Sun" mark -->
  <g transform="translate(540,44)">
    <circle cx="60" cy="60" r="56" fill="#FBF6EC"/>
    <g clip-path="url(#ogMark)">
      <circle cx="60" cy="48" r="15" fill="#F2B35A" stroke="#0F2D3D" stroke-width="1.4"/>
      <path d="M18 62 Q 39 57 60 62 T 102 62" stroke="#1F6C7E" stroke-width="3.4" stroke-linecap="round" fill="none"/>
      <path d="M23 71 Q 41.5 75.5 60 71 T 97 71" stroke="#67B7BC" stroke-width="3.4" stroke-linecap="round" fill="none"/>
      <path d="M29 80 Q 45 75.5 60 80 T 91 80" stroke="#1F6C7E" stroke-width="3.4" stroke-linecap="round" fill="none"/>
      <path d="M37 89 Q 50 92.5 60 89 T 83 89" stroke="#67B7BC" stroke-width="3.4" stroke-linecap="round" fill="none"/>
    </g>
    <circle cx="60" cy="60" r="56" fill="none" stroke="#0F2D3D" stroke-width="3.5"/>
  </g>

  <!-- Main text -->
  <text x="600" y="268" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-weight="400" font-size="80" fill="white" letter-spacing="-1">Žnjan Beach</text>
  <!-- Divider -->
  <line x1="490" y1="296" x2="710" y2="296" stroke="white" stroke-width="2" opacity="0.5"/>
  <!-- Subtitle -->
  <text x="600" y="338" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-weight="500" font-size="28" fill="white" opacity="0.92">Split, Croatia · The Miami of Split</text>
  <!-- Tagline -->
  <text x="600" y="386" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-weight="400" font-size="22" fill="#90E0EF" opacity="0.95">The Complete Beach Guide — Activities, Places &amp; Stays</text>
  <!-- Domain badge -->
  <rect x="490" y="528" width="220" height="44" rx="22" fill="white" opacity="0.15"/>
  <text x="600" y="556" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="22" fill="white" opacity="0.95">znjan.com</text>
</svg>
