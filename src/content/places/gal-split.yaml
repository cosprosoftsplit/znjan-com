description:
  en: "GAL Split is a modern cafe-lounge-restaurant on the Žnjan promenade, blending design, sea breeze, and vibrant energy into a Mediterranean lifestyle experience. The menu spans breakfast (shakshuka, French toast), artisan pizzas, cold starters, and full lunch and dinner options. The Costa Coffee partnership and craft cocktails make it equally suited for a morning espresso or an evening out. Features natural stone interiors, warm wood, and a sculptural entrance leading to an outdoor terrace with Adriatic views."
  hr: "GAL Split moderan je kafić-lounge-restoran na žnjanskoj šetnici, koji spaja dizajn, morski povjetarac i živahnu energiju u mediteransko iskustvo. Jelovnik obuhvaća doručak (shakshuka, francuski tost), autorske pizze, hladna predjela i kompletnu ponudu za ručak i večeru. Partnerstvo s Costa Coffee i craft kokteli čine ga jednako prikladnim za jutarnji espresso ili večernji izlazak. Odlikuje se interijerom od prirodnog kamena i toplog drveta, sa skulpturalnim ulazom koji vodi na vanjsku terasu s pogledom na Jadran."
  de: "GAL Split ist ein modernes Café-Lounge-Restaurant an der Žnjan-Promenade, das Design, Meeresbrise und lebhafte Energie zu einem mediterranen Lifestyle-Erlebnis verbindet. Die Speisekarte umfasst Frühstück (Shakshuka, French Toast), handwerkliche Pizzen, kalte Vorspeisen und vollständige Mittag- und Abendoptionen. Die Costa Coffee-Partnerschaft und Craft-Cocktails machen es sowohl für den Morgenespresso als auch für den Abend geeignet. Naturstein-Interieur, warmes Holz und ein skulpturaler Eingang führen zur Außenterrasse mit Adriablick."
  it: "GAL Split è un moderno caffè-lounge-ristorante sul lungomare di Žnjan, che fonde design, brezza marina ed energia vibrante in un'esperienza di stile di vita mediterraneo. Il menu spazia dalla colazione (shakshuka, french toast), pizze artigianali, antipasti freddi e opzioni complete per pranzo e cena. La partnership con Costa Coffee e i cocktail artigianali lo rendono adatto sia per un espresso mattutino che per una serata fuori. Interni in pietra naturale, legno caldo e un ingresso scultoreo conducono alla terrazza esterna con vista sull'Adriatico."
  fr: "GAL Split est un café-lounge-restaurant moderne sur la promenade de Žnjan, mêlant design, brise marine et énergie vibrante pour une véritable expérience de l'art de vivre méditerranéen. La carte couvre le petit-déjeuner (shakshuka, pain perdu), les pizzas artisanales, les entrées froides ainsi qu'une offre complète pour le déjeuner et le dîner. Le partenariat avec Costa Coffee et les cocktails maison en font une adresse aussi parfaite pour un espresso matinal que pour une soirée. Intérieurs en pierre naturelle, bois chaleureux et une entrée sculpturale ouvrant sur une terrasse extérieure avec vue sur l'Adriatique."
  es: "GAL Split es un moderno café-lounge-restaurante en el paseo marítimo de Žnjan que fusiona diseño, brisa marina y energía vibrante en una auténtica experiencia de estilo de vida mediterráneo. La carta abarca desayunos (shakshuka, tostadas francesas), pizzas artesanas, entrantes fríos y una propuesta completa para comer y cenar. La alianza con Costa Coffee y los cócteles de autor lo hacen igual de apetecible para un espresso matutino que para una velada nocturna. Interiores de piedra natural, madera cálida y una entrada escultórica que conduce a una terraza exterior con vistas al Adriático."
  pl: "GAL Split to nowoczesna kawiarnia-lounge-restauracja na promenadzie Žnjan, łącząca design, morską bryzę i tętniącą energię w prawdziwym śródziemnomorskim stylu życia. W menu znajdują się śniadania (shakshuka, tosty francuskie), rzemieślnicze pizze, zimne przystawki oraz pełna oferta lunchowa i kolacyjna. Partnerstwo z Costa Coffee i autorskie koktajle sprawiają, że to miejsce idealne zarówno na poranne espresso, jak i na wieczorne wyjście. Wnętrza z naturalnego kamienia, ciepłe drewno i rzeźbiarskie wejście prowadzą na zewnętrzny taras z widokiem na Adriatyk."
  nl: "GAL Split is een modern café-lounge-restaurant aan de promenade van Žnjan, waar design, zeebries en bruisende energie samenkomen in een echte mediterrane lifestyle-ervaring. De kaart loopt van ontbijt (shakshuka, wentelteefjes) en ambachtelijke pizza's tot koude voorgerechten en een volledig lunch- en dineraanbod. Dankzij de samenwerking met Costa Coffee en de craftcocktails is het net zo geschikt voor een ochtendespresso als voor een avondje uit. Interieurs van natuursteen, warm hout en een sculpturale entree leiden naar een buitenterras met uitzicht op de Adriatische Zee."
