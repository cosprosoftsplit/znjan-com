id: family-friendly
question:
  en: "Is Žnjan Beach family-friendly?"
  hr: "Je li plaža Žnjan pogodna za obitelji?"
  de: "Ist der Strand Žnjan familienfreundlich?"
  it: "La spiaggia di Žnjan è adatta alle famiglie?"
  fr: "La plage de Žnjan est-elle adaptée aux familles ?"
  es: "¿Es la playa de Žnjan ideal para familias?"
  pl: "Czy plaża Žnjan jest przyjazna rodzinom?"
  nl: "Is het strand van Žnjan gezinsvriendelijk?"
answer:
  en: "Yes, Žnjan Beach is one of Split's most family-friendly beaches. It features dedicated kids' play areas with shallow water entry, lifeguards on duty from June to September, shaded seating areas, playgrounds, accessible pathways for strollers, family-oriented restaurants, and clean modern restroom facilities. The gentle pebble surface makes it safer than rocky beaches."
  hr: "Da, plaža Žnjan jedna je od najpogodnijih splitskih plaža za obitelji. Ima posebne dječje zone s plitkim ulaskom u more, spasilačku službu od lipnja do rujna, zasjenjene prostore za sjedenje, igrališta, pristupačne staze za kolica, obiteljske restorane i čiste moderne sanitarne čvorove. Nježna šljunčana podloga čini je sigurnijom od kamenih plaža."
  de: "Ja, der Strand Žnjan ist einer der familienfreundlichsten Strände Splits. Er bietet spezielle Kinderbereiche mit flachem Wassereinstieg, Rettungsschwimmer von Juni bis September, schattige Sitzplätze, Spielplätze, barrierefreie Wege für Kinderwagen, familienfreundliche Restaurants und saubere moderne Sanitäranlagen. Der sanfte Kieselstrand ist sicherer als Felsstrände."
  it: "Sì, la spiaggia di Žnjan è una delle più adatte alle famiglie di Spalato. Offre aree gioco dedicate con ingresso in acqua bassa, bagnini in servizio da giugno a settembre, zone ombreggiate, parchi giochi, percorsi accessibili per passeggini, ristoranti per famiglie e servizi igienici moderni e puliti. La superficie di ciottoli è più sicura delle spiagge rocciose."
  fr: "Oui, la plage de Žnjan est l'une des plages les plus familiales de Split. Elle dispose d'espaces de jeux réservés aux enfants avec entrée en eau peu profonde, de sauveteurs en service de juin à septembre, de coins ombragés, d'aires de jeux, de chemins accessibles aux poussettes, de restaurants pour familles et de sanitaires modernes et propres. Le doux sol de galets la rend plus sûre que les plages rocheuses."
  es: "Sí, la playa de Žnjan es una de las más familiares de Split. Cuenta con zonas de juego para niños con entrada al agua poco profunda, socorristas de servicio de junio a septiembre, áreas de descanso con sombra, parques infantiles, senderos accesibles para carritos, restaurantes para toda la familia y aseos modernos y limpios. Su suave superficie de guijarros la hace más segura que las playas rocosas."
  pl: "Tak, plaża Žnjan to jedna z najbardziej przyjaznych rodzinom plaż w Splicie. Oferuje wydzielone strefy zabaw dla dzieci z płytkim wejściem do wody, ratowników na służbie od czerwca do września, zacienione miejsca do wypoczynku, place zabaw, dostępne ścieżki dla wózków, rodzinne restauracje oraz czyste, nowoczesne toalety. Łagodne kamyczki sprawiają, że jest bezpieczniejsza niż plaże skaliste."
  nl: "Ja, het strand van Žnjan is een van de meest gezinsvriendelijke stranden van Split. Het beschikt over speciale speelzones voor kinderen met ondiepe wateringang, badmeesters van juni tot september, schaduwrijke zitplekken, speeltuinen, toegankelijke paden voor kinderwagens, gezinsrestaurants en schone, moderne sanitaire voorzieningen. De zachte kiezelbodem maakt het veiliger dan rotsstranden."
