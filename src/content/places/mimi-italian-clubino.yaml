description:
  en: "MIMI is an Italian clubino and ristorante at Žnjan, blending Italian cuisine with an intimate club atmosphere. Enjoy fresh homemade pasta prepared daily, wood-fired pizzas, a curated wine selection, and craft cocktails in a warm, elegantly styled space. Part of Split's F Group hospitality family (alongside Terminal F and Fabrique), MIMI brings a touch of la dolce vita to the Žnjan promenade."
  hr: "MIMI je talijanski clubino i ristorante na Žnjanu koji spaja talijansku kuhinju s intimnom klubskom atmosferom. Uživajte u svježoj domaćoj tjestenini pripremljenoj svakodnevno, pizzama iz krušne peći, pažljivo odabranom izboru vina i craft koktelima u toplom, elegantno uređenom prostoru. Dio splitske ugostiteljske obitelji F Group (uz Terminal F i Fabrique), MIMI donosi dašak la dolce vita na žnjansku šetnicu."
  de: "MIMI ist ein italienisches Clubino und Ristorante am Žnjan, das italienische Küche mit intimer Club-Atmosphäre verbindet. Genießen Sie täglich frisch zubereitete hausgemachte Pasta, holzofengebackene Pizza, eine kuratierte Weinauswahl und Craft-Cocktails in einem warm und elegant gestalteten Raum. Als Teil der Spliter F Group Gastronomiefamilie (neben Terminal F und Fabrique) bringt MIMI ein Stück La Dolce Vita an die Žnjan-Promenade."
  it: "MIMI è un clubino e ristorante italiano a Žnjan, che unisce la cucina italiana con un'atmosfera da club intimo. Godetevi pasta fresca fatta in casa preparata quotidianamente, pizze cotte nel forno a legna, una selezione curata di vini e cocktail artigianali in uno spazio caldo ed elegante. Parte della famiglia di ristorazione F Group di Spalato (insieme a Terminal F e Fabrique), MIMI porta un tocco di dolce vita sul lungomare di Žnjan."
  fr: "MIMI est un clubino et ristorante italien à Žnjan, qui marie la cuisine italienne à l'ambiance feutrée d'un club intime. Savourez des pâtes fraîches maison préparées chaque jour, des pizzas cuites au feu de bois, une carte des vins soigneusement sélectionnée et des cocktails artisanaux dans un cadre chaleureux et élégant. Membre de la famille hôtelière F Group de Split (aux côtés de Terminal F et Fabrique), MIMI insuffle un air de dolce vita sur la promenade de Žnjan."
  es: "MIMI es un clubino y ristorante italiano en Žnjan que fusiona la cocina italiana con el ambiente acogedor de un club íntimo. Disfruta de pasta fresca casera elaborada a diario, pizzas al horno de leña, una cuidada selección de vinos y cócteles artesanales en un espacio cálido y elegante. Parte de la familia hostelera F Group de Split (junto a Terminal F y Fabrique), MIMI aporta un toque de dolce vita al paseo marítimo de Žnjan."
  pl: "MIMI to włoskie clubino i ristorante na Žnjanie, łączące włoską kuchnię z kameralną, klubową atmosferą. Skosztuj świeżego domowego makaronu przygotowywanego codziennie, pizzy z pieca opalanego drewnem, starannie dobranej karty win oraz autorskich koktajli w ciepłym, elegancko urządzonym wnętrzu. Jako część splickiej grupy gastronomicznej F Group (obok Terminal F i Fabrique) MIMI wnosi odrobinę dolce vita na promenadę Žnjan."
  nl: "MIMI is een Italiaans clubino en ristorante aan Žnjan, waar de Italiaanse keuken samengaat met de intieme sfeer van een club. Geniet van dagvers huisgemaakte pasta, pizza's uit de houtoven, een zorgvuldig samengestelde wijnkaart en ambachtelijke cocktails in een warme, stijlvol ingerichte ruimte. Als onderdeel van de Splitse horecafamilie F Group (naast Terminal F en Fabrique) brengt MIMI een vleugje dolce vita naar de boulevard van Žnjan."
