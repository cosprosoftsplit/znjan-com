id: bacvice-comparison
question:
  en: "Is Žnjan Beach better than Bačvice?"
  hr: "Je li plaža Žnjan bolja od Bačvica?"
  de: "Ist der Strand Žnjan besser als Bačvice?"
  it: "La spiaggia di Žnjan è meglio di Bačvice?"
  fr: "La plage de Žnjan est-elle meilleure que Bačvice ?"
  es: "¿Es la playa de Žnjan mejor que Bačvice?"
  pl: "Czy plaża Žnjan jest lepsza niż Bačvice?"
  nl: "Is het strand van Žnjan beter dan Bačvice?"
answer:
  en: "They're different beaches for different needs. Žnjan is larger (2+ km vs 300 m), has superior facilities after the €45.77M renovation, more restaurants, beach clubs, and a kids' zone. Bačvice is sandy (Žnjan is pebble), closer to the Old Town (7 min walk vs 15 min bus), and has Split's famous picigin game. Choose Žnjan for a full-day beach experience; choose Bačvice for quick access and sand."
  hr: "To su različite plaže za različite potrebe. Žnjan je veći (2+ km naspram 300 m), ima bolje sadržaje nakon renovacije od 45,77 mil. eura, više restorana, beach klubova i dječju zonu. Bačvice su pješčane (Žnjan je šljunčan), bliže Starom gradu (7 min hoda naspram 15 min busom) i imaju poznati splitski picigin. Odaberite Žnjan za cjelodnevni doživljaj; Bačvice za brzi pristup i pijesak."
  de: "Es sind verschiedene Strände für verschiedene Bedürfnisse. Žnjan ist größer (2+ km vs. 300 m), hat nach der 45,77-Mio.-Euro-Renovierung bessere Einrichtungen, mehr Restaurants, Strandclubs und eine Kinderzone. Bačvice hat Sand (Žnjan hat Kiesel), liegt näher an der Altstadt (7 Min. zu Fuß vs. 15 Min. Bus) und bietet das berühmte Picigin-Spiel. Wählen Sie Žnjan für einen ganzen Strandtag; Bačvice für schnellen Zugang und Sand."
  it: "Sono spiagge diverse per esigenze diverse. Žnjan è più grande (2+ km vs 300 m), ha strutture superiori dopo la ristrutturazione da €45,77 milioni, più ristoranti, beach club e una zona bambini. Bačvice è sabbiosa (Žnjan è di ciottoli), più vicina al centro storico (7 min a piedi vs 15 min in bus) e ha il famoso picigin di Spalato. Scegliete Žnjan per una giornata intera in spiaggia; Bačvice per accesso rapido e sabbia."
  fr: "Ce sont deux plages différentes pour des besoins différents. Žnjan est plus vaste (plus de 2 km contre 300 m), offre des équipements supérieurs depuis la rénovation de 45,77 M€, davantage de restaurants, des beach clubs et un espace enfants. Bačvice est sablonneuse (Žnjan est en galets), plus proche de la vieille ville (7 min à pied contre 15 min en bus) et accueille le célèbre picigin de Split. Choisissez Žnjan pour une journée entière à la plage ; optez pour Bačvice pour un accès rapide et du sable."
  es: "Son playas distintas para necesidades distintas. Žnjan es más grande (más de 2 km frente a 300 m), cuenta con mejores instalaciones tras la renovación de 45,77 M€, más restaurantes, beach clubs y una zona infantil. Bačvice es de arena (Žnjan es de guijarros), está más cerca del casco antiguo (7 min a pie frente a 15 min en autobús) y alberga el famoso picigin de Split. Elige Žnjan para una jornada completa de playa; elige Bačvice por su acceso rápido y su arena."
  pl: "To różne plaże dla różnych potrzeb. Žnjan jest większy (ponad 2 km wobec 300 m), oferuje lepszą infrastrukturę po remoncie za 45,77 mln euro, więcej restauracji, beach cluby i strefę dla dzieci. Bačvice jest piaszczysta (Žnjan jest żwirowy), bliżej Starego Miasta (7 min pieszo wobec 15 min autobusem) i słynie ze splickiej gry picigin. Wybierz Žnjan na całodzienny wypoczynek na plaży; wybierz Bačvice dla szybkiego dojścia i piasku."
  nl: "Het zijn verschillende stranden voor verschillende behoeften. Žnjan is groter (ruim 2 km tegenover 300 m), beschikt na de renovatie van 45,77 miljoen euro over betere voorzieningen, meer restaurants, beachclubs en een kinderzone. Bačvice heeft zand (Žnjan is kiezel), ligt dichter bij de oude stad (7 min lopen tegenover 15 min met de bus) en is de thuisbasis van Splits beroemde picigin-spel. Kies Žnjan voor een hele dag op het strand; kies Bačvice voor snelle toegang en zand."
