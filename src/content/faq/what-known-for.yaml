id: what-known-for
question:
  en: "What is Žnjan Beach known for?"
  hr: "Po čemu je poznata plaža Žnjan?"
  de: "Wofür ist der Strand Žnjan bekannt?"
  it: "Per cosa è conosciuta la spiaggia di Žnjan?"
  fr: "Pourquoi la plage de Žnjan est-elle réputée ?"
  es: "¿Por qué es conocida la playa de Žnjan?"
  pl: "Z czego słynie plaża Žnjan?"
  nl: "Waar staat het strand van Žnjan om bekend?"
answer:
  en: "Žnjan is known as Split's largest beach (2+ km), its €45.77 million transformation completed in 2025 that earned it the nickname 'Miami of Split', its 11 new pavilion restaurants and beach clubs, the modern promenade for cycling and running, excellent facilities for families, and being one of Croatia's most accessible beaches with wheelchair ramps and a sea-access elevator."
  hr: "Žnjan je poznat kao najveća splitska plaža (2+ km), transformacija od 45,77 milijuna eura dovršena 2025. godine koja mu je donijela nadimak 'Miami Splita', 11 novih paviljonskih restorana i beach klubova, moderna šetnica za biciklizam i trčanje, odlični sadržaji za obitelji te kao jedna od najpristupačnijih plaža u Hrvatskoj s rampama za invalidska kolica i dizalom za pristup moru."
  de: "Žnjan ist bekannt als Splits größter Strand (2+ km), seine 45,77-Millionen-Euro-Transformation von 2025, die ihm den Spitznamen 'Miami von Split' einbrachte, seine 11 neuen Pavillon-Restaurants und Strandclubs, die moderne Promenade zum Radfahren und Laufen, ausgezeichnete Einrichtungen für Familien sowie als einer der barrierefreiesten Strände Kroatiens mit Rollstuhlrampen und einem Meereszugangslift."
  it: "Žnjan è conosciuta come la spiaggia più grande di Spalato (2+ km), la sua trasformazione da €45,77 milioni completata nel 2025 che le ha valso il soprannome di 'Miami di Spalato', i suoi 11 nuovi ristoranti e beach club nei padiglioni, il moderno lungomare per ciclismo e corsa, eccellenti strutture per le famiglie, e come una delle spiagge più accessibili della Croazia con rampe per sedie a rotelle e un ascensore per l'accesso al mare."
  fr: "Žnjan est réputée pour être la plus grande plage de Split (plus de 2 km), pour sa métamorphose à 45,77 millions d'euros achevée en 2025 qui lui a valu le surnom de « Miami de Split », pour ses 11 nouveaux restaurants et beach clubs en pavillons, pour sa promenade moderne propice au vélo et à la course, pour ses excellents équipements pour les familles, et pour figurer parmi les plages les plus accessibles de Croatie, avec ses rampes pour fauteuils roulants et son ascenseur d'accès à la mer."
  es: "Žnjan es conocida por ser la mayor playa de Split (más de 2 km), por su transformación de 45,77 millones de euros culminada en 2025 que le valió el apodo de «la Miami de Split», por sus 11 nuevos restaurantes y beach clubs en pabellones, por su moderno paseo marítimo ideal para ir en bici y correr, por sus excelentes instalaciones para familias y por ser una de las playas más accesibles de Croacia, con rampas para sillas de ruedas y un ascensor de acceso al mar."
  pl: "Žnjan słynie z tego, że jest największą plażą Splitu (ponad 2 km), z metamorfozy za 45,77 mln euro ukończonej w 2025 roku, dzięki której zyskała przydomek „Miami Splitu”, z 11 nowych restauracji i beach clubów w pawilonach, z nowoczesnej promenady do jazdy na rowerze i biegania, ze znakomitej infrastruktury dla rodzin oraz z tego, że należy do najbardziej dostępnych plaż w Chorwacji – z podjazdami dla wózków inwalidzkich i windą prowadzącą do morza."
  nl: "Žnjan staat bekend als het grootste strand van Split (ruim 2 km), om zijn transformatie van 45,77 miljoen euro die in 2025 werd voltooid en het de bijnaam 'Miami van Split' opleverde, om zijn 11 nieuwe paviljoenrestaurants en beachclubs, om de moderne boulevard om te fietsen en te hardlopen, om de uitstekende voorzieningen voor gezinnen, en als een van de meest toegankelijke stranden van Kroatië, met rolstoelhellingen en een lift naar de zee."
category: general
order: 30
