id: opening-hours
question:
  en: "What are the opening hours of Žnjan Beach?"
  hr: "Koje je radno vrijeme plaže Žnjan?"
  de: "Was sind die Öffnungszeiten des Strandes Žnjan?"
  it: "Quali sono gli orari di apertura della spiaggia di Žnjan?"
  fr: "Quels sont les horaires d'ouverture de la plage de Žnjan ?"
  es: "¿Cuál es el horario de la playa de Žnjan?"
  pl: "Jakie są godziny otwarcia plaży Žnjan?"
  nl: "Wat zijn de openingstijden van het strand van Žnjan?"
answer:
  en: "Žnjan Beach is a public beach and is open 24 hours a day, year-round. There is no entrance fee. However, beach clubs, restaurants, and lifeguard services operate seasonally — typically from June to September, with some venues opening in May and closing in October. The promenade is accessible at all times."
  hr: "Plaža Žnjan je javna plaža i otvorena je 24 sata dnevno, cijele godine. Nema ulaznice. Međutim, beach klubovi, restorani i spasilačka služba rade sezonski — obično od lipnja do rujna, a neki lokali otvaraju u svibnju i zatvaraju u listopadu. Šetnica je dostupna u svako doba."
  de: "Der Strand Žnjan ist ein öffentlicher Strand und rund um die Uhr das ganze Jahr geöffnet. Es gibt keinen Eintrittspreis. Strandclubs, Restaurants und Rettungsschwimmer arbeiten saisonbedingt — in der Regel von Juni bis September, einige Lokale öffnen im Mai und schließen im Oktober. Die Promenade ist jederzeit zugänglich."
  it: "La spiaggia di Žnjan è una spiaggia pubblica aperta 24 ore su 24, tutto l'anno. Non c'è biglietto d'ingresso. Tuttavia, beach club, ristoranti e servizio bagnini operano stagionalmente — generalmente da giugno a settembre, con alcuni locali che aprono a maggio e chiudono a ottobre. Il lungomare è accessibile in qualsiasi momento."
  fr: "La plage de Žnjan est une plage publique, ouverte 24 h/24 toute l'année, et l'accès est entièrement gratuit. En revanche, les beach clubs, les restaurants et le service de sauveteurs fonctionnent de façon saisonnière — généralement de juin à septembre, certains établissements ouvrant dès mai et fermant en octobre. La promenade reste accessible à tout moment."
  es: "La playa de Žnjan es una playa pública, abierta las 24 horas durante todo el año, y la entrada es totalmente gratuita. No obstante, los beach clubs, los restaurantes y el servicio de socorristas funcionan por temporada: por lo general de junio a septiembre, y algunos locales abren ya en mayo y cierran en octubre. El paseo marítimo es accesible en todo momento."
  pl: "Plaża Žnjan jest plażą publiczną, czynną przez całą dobę i przez cały rok, a wstęp jest całkowicie bezpłatny. Kluby plażowe, restauracje i służba ratownicza działają jednak sezonowo — zwykle od czerwca do września, przy czym niektóre lokale otwierają się już w maju i zamykają w październiku. Promenada jest dostępna o każdej porze."
  nl: "Het strand van Žnjan is een openbaar strand, het hele jaar door 24 uur per dag geopend, en de toegang is volledig gratis. De beachclubs, restaurants en de strandwacht zijn echter seizoensgebonden — doorgaans van juni tot september, waarbij sommige gelegenheden al in mei opengaan en in oktober sluiten. De promenade is op elk moment toegankelijk."
