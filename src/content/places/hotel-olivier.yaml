description:
  en: "Hotel Olivier is a boutique 4-star hotel on the Žnjan promenade in Split, a short walk from Žnjan Beach. Its 22 elegantly appointed rooms — including suites and doubles with balconies and Adriatic sea views — offer an intimate, design-led stay. At its heart is Restaurant Olivier, serving classical Mediterranean cuisine, alongside a spa and wellness area with an indoor pool with a cascading waterfall and three saunas, a fitness area, free parking, and a daily breakfast."
  hr: "Hotel Olivier boutique je hotel s 4 zvjezdice na žnjanskoj šetnici u Splitu, na kratkoj šetnji od plaže Žnjan. Njegove 22 elegantno uređene sobe — uključujući apartmane i dvokrevetne sobe s balkonima i pogledom na Jadran — pružaju intiman boravak s naglaskom na dizajn. U njegovu je središtu Restoran Olivier s klasičnom mediteranskom kuhinjom, uz spa i wellness s unutarnjim bazenom s kaskadnim slapom i tri saune, fitness, besplatan parking i svakodnevni doručak."
  de: "Das Hotel Olivier ist ein Boutique-4-Sterne-Hotel an der Promenade von Žnjan in Split, nur einen kurzen Spaziergang vom Strand Žnjan entfernt. Seine 22 elegant eingerichteten Zimmer — darunter Suiten und Doppelzimmer mit Balkon und Blick auf die Adria — bieten einen intimen, designorientierten Aufenthalt. Im Mittelpunkt steht das Restaurant Olivier mit klassischer mediterraner Küche, ergänzt durch einen Spa- und Wellnessbereich mit Innenpool mit Kaskadenwasserfall und drei Saunen, einen Fitnessbereich, kostenlose Parkplätze und ein tägliches Frühstück."
  it: "L'Hotel Olivier è un boutique hotel a 4 stelle sulla passeggiata di Žnjan a Spalato, a breve distanza a piedi dalla spiaggia di Žnjan. Le sue 22 camere elegantemente arredate — tra cui suite e camere doppie con balcone e vista sull'Adriatico — offrono un soggiorno intimo e curato nel design. Al centro c'è il Ristorante Olivier, con cucina mediterranea classica, affiancato da una spa e area wellness con piscina interna con cascata e tre saune, una zona fitness, parcheggio gratuito e colazione giornaliera."
  fr: "L'Hotel Olivier est un hôtel-boutique 4 étoiles sur la promenade de Žnjan à Split, à quelques minutes à pied de la plage de Žnjan. Ses 22 chambres élégamment aménagées — dont des suites et des chambres doubles avec balcon et vue sur l'Adriatique — offrent un séjour intime au design soigné. En son cœur, le Restaurant Olivier propose une cuisine méditerranéenne classique, aux côtés d'un espace spa et bien-être avec piscine intérieure à cascade et trois saunas, un espace fitness, un parking gratuit et un petit-déjeuner quotidien."
  es: "El Hotel Olivier es un hotel boutique de 4 estrellas en el paseo marítimo de Žnjan, en Split, a pocos minutos a pie de la playa de Žnjan. Sus 22 habitaciones de elegante diseño —incluidas suites y habitaciones dobles con balcón y vistas al Adriático— ofrecen una estancia íntima y cuidada. Su corazón es el Restaurante Olivier, con cocina mediterránea clásica, junto a una zona de spa y bienestar con piscina cubierta con cascada y tres saunas, un gimnasio, aparcamiento gratuito y desayuno diario."
  pl: "Hotel Olivier to butikowy hotel czterogwiazdkowy przy promenadzie Žnjan w Splicie, w niewielkiej odległości spacerem od plaży Žnjan. Jego 22 elegancko urządzone pokoje — w tym apartamenty i pokoje dwuosobowe z balkonami i widokiem na Adriatyk — zapewniają kameralny pobyt z dbałością o design. Sercem hotelu jest Restauracja Olivier z klasyczną kuchnią śródziemnomorską, a do tego strefa spa i wellness z basenem wewnętrznym z kaskadą i trzema saunami, strefa fitness, bezpłatny parking i codzienne śniadanie."
  nl: "Hotel Olivier is een boutique viersterrenhotel aan de promenade van Žnjan in Split, op een korte wandeling van het strand van Žnjan. De 22 stijlvol ingerichte kamers — waaronder suites en tweepersoonskamers met balkon en uitzicht op de Adriatische Zee — bieden een intiem verblijf met oog voor design. In het hart ligt Restaurant Olivier met klassieke mediterrane keuken, naast een spa- en wellnessruimte met binnenzwembad met cascadewaterval en drie sauna's, een fitnessruimte, gratis parkeren en een dagelijks ontbijt."
