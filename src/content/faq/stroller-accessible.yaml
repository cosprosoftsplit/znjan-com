id: stroller-accessible
question:
  en: "Is Žnjan Beach stroller-friendly?"
  hr: "Je li plaža Žnjan prilagođena kolicima za bebe?"
  de: "Ist der Strand Žnjan kinderwagentauglich?"
  it: "La spiaggia di Žnjan è adatta ai passeggini?"
  fr: "La plage de Žnjan est-elle accessible en poussette ?"
  es: "¿La playa de Žnjan es accesible con cochecito?"
  pl: "Czy plaża Žnjan jest przyjazna dla wózków dziecięcych?"
  nl: "Is het strand van Žnjan toegankelijk met een kinderwagen?"
answer:
  en: "Yes. The 2 km promenade is flat, paved, and wide — perfect for strollers and pushchairs. Ramps connect the promenade to the beach level. However, once on the beach itself, wheels don't roll well on pebbles. Most parents park the stroller on the promenade and carry children to their beach spot."
  hr: "Da. Šetnica od 2 km je ravna, popločena i široka — savršena za kolica za bebe. Rampe povezuju šetnicu s razinom plaže. Međutim, na samoj plaži kotači se ne kreću dobro po šljunku. Većina roditelja ostavlja kolica na šetnici i nosi djecu do svog mjesta na plaži."
  de: "Ja. Die 2 km lange Promenade ist flach, gepflastert und breit — perfekt für Kinderwagen. Rampen verbinden die Promenade mit dem Strandniveau. Auf dem Kieselstrand selbst rollen Räder allerdings nicht gut. Die meisten Eltern parken den Kinderwagen an der Promenade und tragen die Kinder zu ihrem Strandplatz."
  it: "Sì. Il lungomare di 2 km è piano, pavimentato e largo — perfetto per passeggini. Le rampe collegano il lungomare al livello della spiaggia. Tuttavia, sulla spiaggia stessa le ruote non scorrono bene sui ciottoli. La maggior parte dei genitori lascia il passeggino sul lungomare e porta i bambini al proprio posto in spiaggia."
  fr: "Oui. La promenade de 2 km est plane, pavée et large — idéale pour les poussettes. Des rampes relient la promenade au niveau de la plage. En revanche, une fois sur la plage, les roues peinent à avancer sur les galets. La plupart des parents laissent la poussette sur la promenade et portent leurs enfants jusqu'à leur coin de plage."
  es: "Sí. El paseo marítimo de 2 km es llano, pavimentado y amplio — ideal para cochecitos. Las rampas conectan el paseo con el nivel de la playa. Sin embargo, una vez en la playa, las ruedas no avanzan bien sobre los guijarros. La mayoría de los padres dejan el cochecito en el paseo y llevan a sus hijos en brazos hasta su sitio en la playa."
  pl: "Tak. Dwukilometrowa promenada jest płaska, wybrukowana i szeroka — idealna dla wózków dziecięcych. Rampy łączą promenadę z poziomem plaży. Jednak na samej plaży koła słabo toczą się po kamykach. Większość rodziców zostawia wózek na promenadzie i znosi dzieci na rękach na swoje miejsce na plaży."
  nl: "Ja. De 2 km lange promenade is vlak, bestraat en breed — perfect voor kinderwagens. Hellingbanen verbinden de promenade met het strandniveau. Op het strand zelf rollen de wielen echter slecht over de kiezels. De meeste ouders parkeren de kinderwagen op de promenade en dragen hun kinderen naar hun plekje op het strand."
