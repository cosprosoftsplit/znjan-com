id: shade
question:
  en: "Is there shade at Žnjan Beach?"
  hr: "Ima li hlada na plaži Žnjan?"
  de: "Gibt es Schatten am Strand Žnjan?"
  it: "C'è ombra alla spiaggia di Žnjan?"
  fr: "Y a-t-il de l'ombre à la plage de Žnjan ?"
  es: "¿Hay sombra en la playa de Žnjan?"
  pl: "Czy na plaży Žnjan jest cień?"
  nl: "Is er schaduw op het strand van Žnjan?"
answer:
  en: "Natural shade is limited on the main beach. There are some trees along the promenade and in landscaped areas behind the beach. Beach clubs offer parasols with sunbed rental (€20–50). For free shade, arrive early to claim spots near the trees. The newly planted 730 trees will provide more shade as they mature over the coming years."
  hr: "Prirodni hlad na glavnoj plaži je ograničen. Ima stabala uz šetnicu i u uređenim zelenim površinama iza plaže. Beach klubovi nude suncobrane uz najam ležaljki (20–50 €). Ako tražite besplatni hlad, dođite rano i zauzmite mjesta blizu stabala. Novoposađenih 730 stabala pružat će više hlada kako budu rasla."
  de: "Natürlicher Schatten ist am Hauptstrand begrenzt. Entlang der Promenade und in den begrünten Bereichen hinter dem Strand gibt es einige Bäume. Strandclubs bieten Sonnenschirme mit Liegenverleih (20–50 €). Für kostenlosen Schatten kommen Sie früh und sichern Sie sich Plätze in Baumnähe. Die 730 neu gepflanzten Bäume werden in den kommenden Jahren mehr Schatten spenden."
  it: "L'ombra naturale è limitata sulla spiaggia principale. Ci sono alcuni alberi lungo il lungomare e nelle aree verdi dietro la spiaggia. I beach club offrono ombrelloni con noleggio lettini (20–50 €). Per l'ombra gratuita, arrivate presto per occupare i posti vicino agli alberi. I 730 alberi appena piantati forniranno più ombra man mano che cresceranno."
  fr: "L'ombre naturelle est limitée sur la plage principale. Quelques arbres bordent la promenade et les espaces verts aménagés à l'arrière de la plage. Les beach clubs proposent des parasols avec location de transats (20–50 €). Pour profiter d'une ombre gratuite, arrivez tôt afin de réserver une place près des arbres. Les 730 arbres récemment plantés offriront davantage d'ombre à mesure qu'ils grandiront au fil des années."
  es: "La sombra natural es limitada en la playa principal. Hay algunos árboles a lo largo del paseo marítimo y en las zonas ajardinadas detrás de la playa. Los beach clubs ofrecen sombrillas con alquiler de tumbonas (20–50 €). Para conseguir sombra gratis, llega temprano y reserva un sitio cerca de los árboles. Los 730 árboles recién plantados darán más sombra a medida que crezcan en los próximos años."
  pl: "Naturalnego cienia na głównej plaży jest niewiele. Kilka drzew rośnie wzdłuż promenady oraz na zagospodarowanych terenach zielonych za plażą. Beach cluby oferują parasole z wynajmem leżaków (20–50 €). Aby skorzystać z darmowego cienia, przyjdź wcześnie i zajmij miejsce w pobliżu drzew. Nowo posadzonych 730 drzew zapewni więcej cienia, gdy podrosną w nadchodzących latach."
  nl: "Natuurlijke schaduw is beperkt op het hoofdstrand. Er staan enkele bomen langs de promenade en in de aangelegde groenzones achter het strand. Beachclubs verhuren parasols met ligbedden (20–50 €). Wil je gratis schaduw, kom dan vroeg om een plek bij de bomen te bemachtigen. De 730 nieuw geplantte bomen zullen de komende jaren meer schaduw geven naarmate ze groeien."
