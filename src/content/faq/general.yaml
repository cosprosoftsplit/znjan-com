id: general-faq
question:
  en: "Where is Žnjan Beach located?"
  hr: "Gdje se nalazi plaža Žnjan?"
  de: "Wo befindet sich der Strand Žnjan?"
  it: "Dove si trova la spiaggia di Žnjan?"
  fr: "Où se trouve la plage de Žnjan ?"
  es: "¿Dónde se encuentra la playa de Žnjan?"
  pl: "Gdzie znajduje się plaża Žnjan?"
  nl: "Waar ligt het strand van Žnjan?"
answer:
  en: "Žnjan Beach is located in the eastern part of Split, Croatia, about 4 km from Diocletian's Palace. It's the city's largest beach, stretching over 2 km along the coast. It's easily accessible by car (underground garage with 530 spaces), bus (lines 8 and 15), Uber (€6–9 from Old Town), or bicycle."
  hr: "Plaža Žnjan nalazi se u istočnom dijelu Splita, Hrvatska, oko 4 km od Dioklecijanove palače. To je najveća gradska plaža, koja se proteže više od 2 km uz obalu. Lako je dostupna automobilom (podzemna garaža s 530 mjesta), autobusom (linije 8 i 15), Uberom (6-9€ iz centra) ili biciklom."
  de: "Der Strand Žnjan befindet sich im östlichen Teil von Split, Kroatien, etwa 4 km vom Diokletianpalast entfernt. Es ist der größte Strand der Stadt und erstreckt sich über 2 km entlang der Küste. Er ist leicht mit dem Auto (Tiefgarage mit 530 Plätzen), Bus (Linien 8 und 15), Uber (6-9 € aus der Altstadt) oder Fahrrad erreichbar."
  it: "La spiaggia di Žnjan si trova nella parte orientale di Spalato, Croazia, a circa 4 km dal Palazzo di Diocleziano. È la spiaggia più grande della città, che si estende per oltre 2 km lungo la costa. È facilmente raggiungibile in auto (garage sotterraneo con 530 posti), autobus (linee 8 e 15), Uber (6-9€ dal centro storico) o bicicletta."
  fr: "La plage de Žnjan se situe dans la partie est de Split, en Croatie, à environ 4 km du palais de Dioclétien. C'est la plus grande plage de la ville, qui s'étend sur plus de 2 km le long de la côte. Elle est facilement accessible en voiture (parking souterrain de 530 places), en bus (lignes 8 et 15), en Uber (6 à 9 € depuis la vieille ville) ou à vélo."
  es: "La playa de Žnjan se encuentra en la parte oriental de Split, Croacia, a unos 4 km del Palacio de Diocleciano. Es la playa más grande de la ciudad y se extiende a lo largo de más de 2 km de costa. Es de fácil acceso en coche (aparcamiento subterráneo con 530 plazas), autobús (líneas 8 y 15), Uber (6-9 € desde el casco antiguo) o bicicleta."
  pl: "Plaża Žnjan położona jest we wschodniej części Splitu w Chorwacji, około 4 km od Pałacu Dioklecjana. To największa plaża w mieście, ciągnąca się ponad 2 km wzdłuż wybrzeża. Łatwo do niej dotrzeć samochodem (podziemny parking na 530 miejsc), autobusem (linie 8 i 15), Uberem (6–9 € ze Starego Miasta) lub rowerem."
  nl: "Het strand van Žnjan ligt in het oostelijke deel van Split, Kroatië, ongeveer 4 km van het Paleis van Diocletianus. Het is het grootste strand van de stad en strekt zich uit over meer dan 2 km langs de kust. Het is goed bereikbaar met de auto (ondergrondse parkeergarage met 530 plaatsen), de bus (lijnen 8 en 15), Uber (6-9 € vanaf de oude binnenstad) of de fiets."
