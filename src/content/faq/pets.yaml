id: pets
question:
  en: "Can I bring my dog to Žnjan Beach?"
  hr: "Mogu li dovesti psa na plažu Žnjan?"
  de: "Kann ich meinen Hund zum Strand Žnjan mitbringen?"
  it: "Posso portare il mio cane alla spiaggia di Žnjan?"
  fr: "Puis-je emmener mon chien à la plage de Žnjan ?"
  es: "¿Puedo llevar a mi perro a la playa de Žnjan?"
  pl: "Czy mogę przyprowadzić psa na plażę Žnjan?"
  nl: "Mag ik mijn hond meenemen naar het strand van Žnjan?"
answer:
  en: "Dogs are generally not allowed on the main bathing areas of Žnjan Beach during summer season (June–September) between 8am and 8pm, as per Split's city ordinance for organised beaches. However, the promenade is dog-friendly for walks. Outside of peak season and hours, regulations are more relaxed. Check local signage for the most current rules."
  hr: "Psi općenito nisu dopušteni na glavnim kupalištima plaže Žnjan tijekom ljetne sezone (lipanj–rujan) od 8 do 20 sati, prema gradskoj odluci za uređene plaže. Međutim, šetnica je pogodna za šetnje sa psima. Izvan sezone i vršnih sati, pravila su fleksibilnija. Provjerite lokalne oznake za najnovija pravila."
  de: "Hunde sind in den Hauptbadebereichen des Strandes Žnjan während der Sommersaison (Juni–September) zwischen 8 und 20 Uhr gemäß der Stadtverordnung Splits für organisierte Strände generell nicht erlaubt. Die Promenade ist jedoch hundefreundlich für Spaziergänge. Außerhalb der Hauptsaison und -zeiten sind die Regelungen flexibler. Achten Sie auf lokale Beschilderung."
  it: "I cani generalmente non sono ammessi nelle aree balneari principali della spiaggia di Žnjan durante la stagione estiva (giugno–settembre) dalle 8 alle 20, secondo l'ordinanza comunale di Spalato per le spiagge organizzate. Tuttavia, il lungomare è adatto alle passeggiate con i cani. Fuori stagione e fuori orario, le regole sono più flessibili. Controllate la segnaletica locale."
  fr: "Les chiens ne sont généralement pas admis sur les principales zones de baignade de la plage de Žnjan pendant la saison estivale (juin–septembre) entre 8h et 20h, conformément à l'arrêté municipal de Split sur les plages aménagées. La promenade reste toutefois accessible aux chiens pour les balades. Hors saison et en dehors de ces horaires, la réglementation est plus souple. Consultez la signalisation locale pour connaître les règles en vigueur."
  es: "Por lo general, no se permiten perros en las principales zonas de baño de la playa de Žnjan durante la temporada de verano (junio–septiembre) entre las 8:00 y las 20:00 horas, según la ordenanza municipal de Split para playas acondicionadas. No obstante, el paseo marítimo sí admite perros para dar paseos. Fuera de temporada y de ese horario, la normativa es más flexible. Consulta la señalización local para conocer las normas vigentes."
  pl: "Psy zazwyczaj nie są wpuszczane na główne kąpieliska plaży Žnjan w sezonie letnim (czerwiec–wrzesień) w godzinach od 8:00 do 20:00, zgodnie z uchwałą miasta Split dotyczącą zagospodarowanych plaż. Promenada jest jednak przyjazna psom i nadaje się na spacery. Poza sezonem i poza tymi godzinami przepisy są bardziej liberalne. Aktualne zasady sprawdzaj na lokalnych tablicach informacyjnych."
  nl: "Honden zijn doorgaans niet toegestaan op de belangrijkste zwemzones van het strand van Žnjan tijdens het zomerseizoen (juni–september) tussen 8.00 en 20.00 uur, conform de stadsverordening van Split voor ingerichte stranden. De boulevard is wel hondvriendelijk om te wandelen. Buiten het hoogseizoen en deze uren zijn de regels soepeler. Raadpleeg de lokale bewegwijzering voor de meest actuele regels."
