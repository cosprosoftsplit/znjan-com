id: znjan-meaning
question:
  en: "What does Žnjan mean? How do you pronounce it?"
  hr: "Što znači Žnjan? Kako se izgovara?"
  de: "Was bedeutet Žnjan? Wie wird es ausgesprochen?"
  it: "Cosa significa Žnjan? Come si pronuncia?"
  fr: "Que signifie Žnjan ? Comment se prononce ce nom ?"
  es: "¿Qué significa Žnjan? ¿Cómo se pronuncia?"
  pl: "Co oznacza Žnjan? Jak się to wymawia?"
  nl: "Wat betekent Žnjan? Hoe spreek je het uit?"
answer:
  en: "Žnjan (pronounced 'ZHNYAN', rhymes roughly with 'onion' with a 'zh' at the start) is the name of a neighbourhood in eastern Split. The name likely derives from old Croatian/Slavic roots. The beach takes its name from this residential area. You may see it written as 'Znjan' without the háček (ž) in informal contexts."
  hr: "Žnjan je ime četvrti u istočnom dijelu Splita. Naziv vjerojatno potječe od starih hrvatskih/slavenskih korijena. Plaža je dobila ime po ovom stambenom području. U neformalnom kontekstu ponekad se piše 'Znjan' bez kvačice (ž)."
  de: "Žnjan (ausgesprochen 'SCHNJANN') ist der Name eines Stadtviertels im östlichen Split. Der Name stammt vermutlich aus altkroatischen/slawischen Wurzeln. Der Strand trägt den Namen dieses Wohngebiets. In informellen Kontexten sehen Sie manchmal die Schreibweise 'Znjan' ohne den Hatschek (ž)."
  it: "Žnjan (pronunciato 'ZNIAN', con la 'ž' come la 'j' francese di 'journal') è il nome di un quartiere nella parte orientale di Spalato. Il nome probabilmente deriva da antiche radici croate/slave. La spiaggia prende il nome da questa zona residenziale. In contesti informali potreste vederlo scritto 'Znjan' senza l'háček (ž)."
  fr: "Žnjan (prononcé « JNYANE », le « ž » se prononçant comme le « j » de « jour ») est le nom d'un quartier de l'est de Split. Ce nom dérive probablement d'anciennes racines croates et slaves. La plage tient son nom de ce quartier résidentiel. Dans des contextes informels, vous le verrez parfois écrit « Znjan », sans le caron (ž)."
  es: "Žnjan (pronunciado «ZHNIAN», con la «ž» parecida a la «j» francesa de «jour») es el nombre de un barrio del este de Split. El nombre proviene probablemente de antiguas raíces croatas y eslavas. La playa toma su nombre de esta zona residencial. En contextos informales a veces lo verás escrito «Znjan», sin el háček (ž)."
  pl: "Žnjan (wymawiane „ŻNIAN”, gdzie „ž” brzmi jak polskie „ż”) to nazwa dzielnicy we wschodniej części Splitu. Nazwa wywodzi się prawdopodobnie ze starych korzeni chorwackich i słowiańskich. Plaża wzięła swoją nazwę od tej dzielnicy mieszkaniowej. W nieformalnych kontekstach można spotkać zapis „Znjan”, bez znaku haczek (ž)."
  nl: "Žnjan (uitgesproken als 'ZJNJAN', waarbij de 'ž' klinkt als de Franse 'j' in 'journaal') is de naam van een wijk in het oosten van Split. De naam stamt waarschijnlijk uit oude Kroatische en Slavische wortels. Het strand is naar deze woonwijk vernoemd. In informele contexten zie je het soms geschreven als 'Znjan', zonder het háček-teken (ž)."
