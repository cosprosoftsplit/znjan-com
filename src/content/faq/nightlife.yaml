id: nightlife
question:
  en: "Is there nightlife at Žnjan Beach?"
  hr: "Ima li noćnog života na plaži Žnjan?"
  de: "Gibt es Nachtleben am Strand Žnjan?"
  it: "C'è vita notturna alla spiaggia di Žnjan?"
  fr: "Y a-t-il une vie nocturne à la plage de Žnjan ?"
  es: "¿Hay vida nocturna en la playa de Žnjan?"
  pl: "Czy na plaży Žnjan jest życie nocne?"
  nl: "Is er nachtleven op het strand van Žnjan?"
answer:
  en: "Yes! Several beach clubs keep the energy going into the evening. Taboo Beach Club is known for DJ sets and VIP cabana experiences, especially on weekends. Palma Beach Club offers cocktails and lounge music with sunset views. Most venues are busiest from Thursday to Sunday during summer season (June–September). For full nightclub experiences, Split's city centre (Riva area) has additional options."
  hr: "Da! Nekoliko beach klubova održava atmosferu do kasnih sati. Taboo Beach Club poznat je po DJ setovima i VIP kabana iskustvu, posebno vikendom. Palma Beach Club nudi koktele i lounge glazbu s pogledom na zalazak sunca. Većina lokala je najživlja od četvrtka do nedjelje tijekom ljetne sezone (lipanj–rujan). Za prave noćne klubove, centar Splita (područje Rive) nudi dodatne mogućnosti."
  de: "Ja! Mehrere Beachclubs sorgen bis in den Abend für Unterhaltung. Der Taboo Beach Club ist bekannt für DJ-Sets und VIP-Cabana-Erlebnisse, besonders am Wochenende. Der Palma Beach Club bietet Cocktails und Lounge-Musik mit Sonnenuntergangsblick. Die meisten Lokale sind von Donnerstag bis Sonntag in der Sommersaison (Juni–September) am belebtesten. Für das volle Nachtclub-Erlebnis bietet das Stadtzentrum Splits (Riva-Gegend) weitere Optionen."
  it: "Sì! Diversi beach club mantengono l'atmosfera fino a sera. Il Taboo Beach Club è noto per i DJ set e le esperienze VIP in cabana, specialmente nei weekend. Il Palma Beach Club offre cocktail e musica lounge con vista tramonto. I locali sono più frequentati dal giovedì alla domenica durante la stagione estiva (giugno–settembre). Per l'esperienza da nightclub, il centro di Spalato (zona Riva) offre ulteriori opzioni."
  fr: "Oui ! Plusieurs beach clubs font durer l'ambiance jusqu'en soirée. Le Taboo Beach Club est réputé pour ses sets de DJ et ses cabanas VIP, surtout le week-end. Le Palma Beach Club propose des cocktails et une musique lounge face au coucher de soleil. La plupart des établissements sont les plus animés du jeudi au dimanche pendant la saison estivale (juin–septembre). Pour une vraie expérience en boîte de nuit, le centre-ville de Split (le secteur de la Riva) offre d'autres options."
  es: "¡Sí! Varios beach clubs mantienen el ambiente animado hasta bien entrada la noche. El Taboo Beach Club es conocido por sus sesiones de DJ y sus experiencias VIP en cabaña, sobre todo los fines de semana. El Palma Beach Club ofrece cócteles y música lounge con vistas al atardecer. La mayoría de los locales tienen su mayor afluencia de jueves a domingo durante la temporada de verano (junio–septiembre). Para una auténtica experiencia de discoteca, el centro de Split (la zona del Riva) cuenta con más opciones."
  pl: "Tak! Kilka beach clubów podtrzymuje atmosferę aż do wieczora. Taboo Beach Club słynie z setów DJ-ów i klimatów VIP w prywatnych kabanach, zwłaszcza w weekendy. Palma Beach Club serwuje koktajle i muzykę lounge z widokiem na zachód słońca. Większość lokali jest najbardziej oblegana od czwartku do niedzieli w sezonie letnim (czerwiec–wrzesień). Po prawdziwe klubowe szaleństwo warto wybrać się do centrum Splitu (okolice nabrzeża Riva), gdzie czeka jeszcze więcej możliwości."
  nl: "Ja! Verschillende beachclubs houden de sfeer er tot in de avond in. Taboo Beach Club staat bekend om zijn dj-sets en vip-cabana's, vooral in het weekend. Palma Beach Club biedt cocktails en loungemuziek met uitzicht op de zonsondergang. De meeste gelegenheden zijn het drukst van donderdag tot zondag tijdens het zomerseizoen (juni–september). Voor een echte nachtclubervaring biedt het centrum van Split (de Riva) extra opties."
