description:
  en: "Radisson Blu Resort & Spa is the premier 4-star resort in the Žnjan area, featuring 252 rooms with balconies overlooking the islands of Brač and Šolta. The resort boasts a 2,600 m² wellness centre with Finnish sauna, steam room, warm and cold pools, whirlpools, and treatment rooms. Guests enjoy indoor and outdoor pools, two restaurants serving Mediterranean cuisine, and direct access to the beach. Home to the Mistral Beach Club, one of Žnjan's top seaside venues."
  hr: "Radisson Blu Resort & Spa vodeći je resort s 4 zvjezdice u žnjanskom području, s 252 sobe s balkonima s pogledom na otoke Brač i Šoltu. Resort se može pohvaliti wellness centrom od 2.600 m² s finskom saunom, parnom kupelji, toplim i hladnim bazenima, whirlpoolima i prostorijama za tretmane. Gosti uživaju u unutarnjem i vanjskom bazenu, dva restorana s mediteranskom kuhinjom i direktnom pristupu plaži. Ovdje se nalazi Mistral Beach Club, jedno od vodećih mjesta na žnjanskoj obali."
  de: "Das Radisson Blu Resort & Spa ist das führende 4-Sterne-Resort im Žnjan-Gebiet mit 252 Zimmern und Balkonen mit Blick auf die Inseln Brač und Šolta. Das Resort verfügt über ein 2.600 m² großes Wellnesscenter mit finnischer Sauna, Dampfbad, Warm- und Kaltwasserpools, Whirlpools und Behandlungsräumen. Gäste genießen Innen- und Außenpool, zwei Restaurants mit mediterraner Küche und direkten Strandzugang. Hier befindet sich der Mistral Beach Club."
  it: "Il Radisson Blu Resort & Spa è il principale resort a 4 stelle nella zona di Žnjan, con 252 camere con balconi con vista sulle isole di Brač e Šolta. Il resort vanta un centro wellness di 2.600 m² con sauna finlandese, bagno turco, piscine calde e fredde, idromassaggi e sale trattamenti. Gli ospiti godono di piscina interna ed esterna, due ristoranti con cucina mediterranea e accesso diretto alla spiaggia. Sede del Mistral Beach Club."
  fr: "Le Radisson Blu Resort & Spa est le grand complexe 4 étoiles du secteur de Žnjan : 252 chambres avec balcon ouvrant sur les îles de Brač et Šolta. L'établissement abrite un espace bien-être de 2 600 m² doté d'un sauna finlandais, d'un hammam, de bassins chauds et froids, de bains à remous et de cabines de soins. Les clients profitent de piscines intérieure et extérieure, de deux restaurants de cuisine méditerranéenne et d'un accès direct à la plage. C'est ici que se trouve le Mistral Beach Club, l'une des adresses balnéaires phares de Žnjan."
  es: "El Radisson Blu Resort & Spa es el principal complejo de 4 estrellas de la zona de Žnjan, con 252 habitaciones con balcón y vistas a las islas de Brač y Šolta. El resort cuenta con un centro de bienestar de 2.600 m² con sauna finlandesa, baño turco, piscinas de agua caliente y fría, jacuzzis y salas de tratamientos. Los huéspedes disfrutan de piscinas interior y exterior, dos restaurantes de cocina mediterránea y acceso directo a la playa. Aquí se encuentra el Mistral Beach Club, uno de los locales junto al mar más destacados de Žnjan."
  pl: "Radisson Blu Resort & Spa to wiodący 4-gwiazdkowy resort w rejonie Žnjan, oferujący 252 pokoje z balkonami z widokiem na wyspy Brač i Šolta. Resort szczyci się strefą wellness o powierzchni 2600 m² z sauną fińską, łaźnią parową, basenami z ciepłą i zimną wodą, jacuzzi oraz gabinetami zabiegowymi. Goście korzystają z basenu krytego i odkrytego, dwóch restauracji serwujących kuchnię śródziemnomorską oraz bezpośredniego dostępu do plaży. To tutaj mieści się Mistral Beach Club, jeden z czołowych nadmorskich lokali Žnjanu."
  nl: "Het Radisson Blu Resort & Spa is het toonaangevende 4-sterrenresort in de omgeving van Žnjan, met 252 kamers met balkon en uitzicht op de eilanden Brač en Šolta. Het resort beschikt over een wellnesscentrum van 2.600 m² met Finse sauna, stoombad, warm- en koudwaterbaden, whirlpools en behandelkamers. Gasten genieten van een binnen- en buitenzwembad, twee restaurants met mediterrane keuken en directe toegang tot het strand. Hier vind je de Mistral Beach Club, een van de topadressen aan de kust van Žnjan."
