id: beach-cost
question:
  en: "Is Žnjan Beach free to visit?"
  hr: "Je li plaža Žnjan besplatna?"
  de: "Ist der Eintritt zum Strand Žnjan kostenlos?"
  it: "L'ingresso alla spiaggia di Žnjan è gratuito?"
  fr: "La plage de Žnjan est-elle gratuite ?"
  es: "¿Es gratis la entrada a la playa de Žnjan?"
  pl: "Czy wstęp na plażę Žnjan jest bezpłatny?"
  nl: "Is het strand van Žnjan gratis te bezoeken?"
answer:
  en: "Yes, Žnjan Beach is completely free to access. It's a public beach with no entry fee. All public sports activities are free, there is no current reservation system, and the sports areas are open on a first-come, first-served basis. You only pay for optional services like sun lounger rental (€20–50 at beach clubs), food and drinks at restaurants, and parking at €1 per hour in the underground garage (530 spaces) and outdoor lots (451 spaces)."
  hr: "Da, plaža Žnjan potpuno je besplatna za pristup. To je javna plaža bez ulaznice. Sve javne sportske aktivnosti su besplatne, trenutačno ne postoji sustav rezervacija, a sportske zone rade po principu tko prvi dođe, prvi koristi. Plaćate samo dodatne usluge poput najma ležaljki (20–50€ u beach clubovima), hrane i pića u restoranima te parkiranja od 1€ po satu u podzemnoj garaži (530 mjesta) i vanjskim parkiralištima (451 mjesto)."
  de: "Ja, der Strand Žnjan ist völlig kostenlos zugänglich. Es ist ein öffentlicher Strand ohne Eintrittsgeld. Alle öffentlichen Sportaktivitäten sind kostenlos, es gibt derzeit kein Reservierungssystem, und die Sportflächen funktionieren nach dem Prinzip 'wer zuerst kommt, nutzt zuerst'. Sie zahlen nur für optionale Leistungen wie Sonnenliegen-Verleih (20–50€ in Strandclubs), Speisen und Getränke in Restaurants sowie Parken für 1€ pro Stunde in der Tiefgarage (530 Plätze) und auf den Außenparkplätzen (451 Plätze)."
  it: "Sì, la spiaggia di Žnjan è completamente gratuita. È una spiaggia pubblica senza biglietto d'ingresso. Tutte le attività sportive pubbliche sono gratuite, al momento non esiste un sistema di prenotazione e le aree sportive funzionano in base al principio del primo arrivato, primo servito. Si paga solo per servizi opzionali come il noleggio lettini (20–50€ nei beach club), cibo e bevande nei ristoranti e il parcheggio a 1€ all'ora nel garage sotterraneo (530 posti) e nei parcheggi esterni (451 posti)."
  fr: "Oui, l'accès à la plage de Žnjan est entièrement gratuit. C'est une plage publique sans droit d'entrée. Toutes les activités sportives publiques sont gratuites, il n'existe actuellement aucun système de réservation et les espaces sportifs fonctionnent selon le principe du premier arrivé, premier servi. Vous ne payez que pour des services optionnels comme la location de transats (20–50 € dans les beach clubs), la restauration et les boissons dans les restaurants, ainsi que le stationnement à 1 € de l'heure dans le parking souterrain (530 places) et les parkings extérieurs (451 places)."
  es: "Sí, el acceso a la playa de Žnjan es totalmente gratuito. Es una playa pública sin entrada de pago. Todas las actividades deportivas públicas son gratuitas, actualmente no existe sistema de reservas y las zonas deportivas funcionan por orden de llegada. Solo se paga por servicios opcionales como el alquiler de hamacas (20–50 € en los beach clubs), la comida y las bebidas en los restaurantes, y el aparcamiento a 1 € por hora en el garaje subterráneo (530 plazas) y en los aparcamientos exteriores (451 plazas)."
  pl: "Tak, wstęp na plażę Žnjan jest całkowicie bezpłatny. To plaża publiczna bez opłaty za wejście. Wszystkie publiczne zajęcia sportowe są darmowe, obecnie nie ma systemu rezerwacji, a strefy sportowe działają według zasady „kto pierwszy, ten lepszy”. Płacisz jedynie za usługi dodatkowe, takie jak wypożyczenie leżaków (20–50 € w beach clubach), jedzenie i napoje w restauracjach oraz parking za 1 € za godzinę w garażu podziemnym (530 miejsc) i na parkingach zewnętrznych (451 miejsc)."
  nl: "Ja, het strand van Žnjan is volledig gratis toegankelijk. Het is een openbaar strand zonder entreegeld. Alle openbare sportactiviteiten zijn gratis, er is momenteel geen reserveringssysteem en de sportzones werken volgens het principe wie het eerst komt, het eerst maalt. Je betaalt alleen voor optionele diensten zoals het huren van ligbedden (20–50 € bij de beach clubs), eten en drinken in de restaurants en parkeren voor 1 € per uur in de ondergrondse garage (530 plekken) en op de buitenparkeerplaatsen (451 plekken)."
