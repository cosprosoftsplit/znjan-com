id: sea-urchins
question:
  en: "Are there sea urchins at Žnjan Beach?"
  hr: "Ima li morskih ježeva na plaži Žnjan?"
  de: "Gibt es Seeigel am Strand Žnjan?"
  it: "Ci sono ricci di mare alla spiaggia di Žnjan?"
  fr: "Y a-t-il des oursins à la plage de Žnjan ?"
  es: "¿Hay erizos de mar en la playa de Žnjan?"
  pl: "Czy na plaży Žnjan występują jeżowce?"
  nl: "Zijn er zee-egels op het strand van Žnjan?"
answer:
  en: "Sea urchins can be found on rocky areas of Žnjan, especially near the eastern end. They are common along the Croatian Adriatic coast. Wearing water shoes is the best prevention — this protects your feet both on the pebble beach and in the water near rocks."
  hr: "Morski ježevi mogu se naći na stjenovitim dijelovima Žnjana, osobito prema istočnom kraju. Česti su duž hrvatske jadranske obale. Nošenje cipela za vodu je najbolja zaštita — štite vam stopala i na šljunčanoj plaži i u vodi blizu stijena."
  de: "Seeigel kommen in felsigen Bereichen von Žnjan vor, besonders am östlichen Ende. Sie sind an der kroatischen Adriaküste häufig. Wasserschuhe sind der beste Schutz — sie schützen Ihre Füße sowohl auf dem Kieselstrand als auch im Wasser in Felsnähe."
  it: "I ricci di mare si trovano nelle zone rocciose di Žnjan, soprattutto verso l'estremità orientale. Sono comuni lungo la costa adriatica croata. Indossare scarpette da scoglio è la migliore prevenzione — proteggono i piedi sia sulla spiaggia di ciottoli che in acqua vicino alle rocce."
  fr: "On trouve des oursins dans les zones rocheuses de Žnjan, surtout vers l'extrémité est. Ils sont fréquents le long de la côte adriatique croate. Porter des chaussures d'eau est la meilleure prévention — elles protègent vos pieds aussi bien sur la plage de galets que dans l'eau près des rochers."
  es: "Los erizos de mar se encuentran en las zonas rocosas de Žnjan, sobre todo cerca del extremo este. Son comunes a lo largo de la costa adriática croata. Llevar escarpines es la mejor prevención: protegen tus pies tanto en la playa de cantos rodados como en el agua cerca de las rocas."
  pl: "Jeżowce można spotkać w skalistych częściach Žnjana, zwłaszcza przy jego wschodnim krańcu. Są powszechne wzdłuż chorwackiego wybrzeża Adriatyku. Buty do wody to najlepsze zabezpieczenie — chronią stopy zarówno na żwirowej plaży, jak i w wodzie w pobliżu skał."
  nl: "Zee-egels komen voor op de rotsachtige delen van Žnjan, vooral richting het oostelijke uiteinde. Ze zijn gewoon langs de Kroatische Adriatische kust. Waterschoenen dragen is de beste bescherming — ze beschermen je voeten zowel op het kiezelstrand als in het water bij de rotsen."
