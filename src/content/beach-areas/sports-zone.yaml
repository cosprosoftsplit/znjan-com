description:
  en: "The active heart of the new Žnjan Beach complex, built as part of the €45M transformation. It includes three beach volleyball courts, basketball courts, cage football pitches, a tennis court, and a brand-new 1,200m² skate park. All public sports activities here are free, there is no current reservation system, and the sports areas are open on a first-come, first-served basis. The sports zone connects to the 1.7km cycling and running path along the promenade."
  hr: "Aktivno srce novog kompleksa plaže Žnjan, izgrađeno u sklopu transformacije od 45 milijuna eura. Sadrži tri terena za odbojku na pijesku, košarkaške terene, kavez za nogomet, teniski teren i potpuno novi skate park od 1.200 m². Sve javne sportske aktivnosti ovdje su besplatne, trenutačno ne postoji sustav rezervacija, a sportske zone su otvorene po principu tko prvi dođe, prvi koristi. Sportska zona povezuje se sa stazom za biciklizam i trčanje od 1,7 km uz šetnicu."
  de: "Das aktive Herz des neuen Žnjan-Strandkomplexes, erbaut im Rahmen der 45-Millionen-Euro-Transformation. Hier gibt es drei Beachvolleyballplätze, Basketballplätze, Käfig-Fußball, einen Tennisplatz und einen brandneuen 1.200 m² großen Skatepark. Alle öffentlichen Sportaktivitäten hier sind kostenlos, es gibt derzeit kein Reservierungssystem, und die Sportflächen sind nach dem Prinzip 'wer zuerst kommt, spielt zuerst' offen zugänglich. Die Sportzone ist mit dem 1,7 km langen Rad- und Laufweg entlang der Promenade verbunden."
  it: "Il cuore attivo del nuovo complesso balneare di Žnjan, costruito nell'ambito della trasformazione da 45 milioni di euro. Comprende tre campi da beach volley, campi da basket, gabbie per il calcetto, un campo da tennis e un nuovissimo skate park di 1.200 m². Tutte le attività sportive pubbliche qui sono gratuite, al momento non esiste un sistema di prenotazione e le aree sportive sono aperte in base al principio del primo arrivato, primo servito. La zona sportiva è collegata al percorso ciclabile e di corsa di 1,7 km lungo il lungomare."
