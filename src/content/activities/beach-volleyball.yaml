description:
  en: "Play beach volleyball on the dedicated courts in Žnjan's sports zone. The courts are part of the public beach area, free to use, and currently operate on a first-come, first-served basis with no reservation system."
  hr: "Igrajte odbojku na pijesku na terenima u sportskoj zoni Žnjana. Tereni su dio javnog prostora plaže, besplatni su za korištenje i trenutačno rade po principu tko prvi dođe, prvi koristi, bez sustava rezervacija."
  de: "Spielen Sie Beachvolleyball auf den Plätzen in der Sportzone von Žnjan. Die Plätze sind Teil des öffentlichen Strandbereichs, kostenlos nutzbar und funktionieren derzeit ohne Reservierungssystem nach dem Prinzip 'wer zuerst kommt, spielt zuerst'."
  it: "Gioca a beach volley sui campi dedicati nella zona sportiva di Žnjan. I campi fanno parte dell'area pubblica della spiaggia, sono gratuiti e al momento funzionano senza prenotazione in base al principio del primo arrivato, primo servito."
