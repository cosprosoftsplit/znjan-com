id: wifi
question:
  en: "Is there WiFi at Žnjan Beach?"
  hr: "Ima li WiFi na plaži Žnjan?"
  de: "Gibt es WLAN am Strand Žnjan?"
  it: "C'è il WiFi alla spiaggia di Žnjan?"
  fr: "Y a-t-il du WiFi à la plage de Žnjan ?"
  es: "¿Hay WiFi en la playa de Žnjan?"
  pl: "Czy na plaży Žnjan jest WiFi?"
  nl: "Is er wifi op het strand van Žnjan?"
answer:
  en: "There is no free public WiFi on the beach itself. However, most beach clubs and restaurants along the promenade offer free WiFi to their customers. Croatian mobile data works well in the area, and most EU visitors can use their home data plans thanks to EU roaming regulations."
  hr: "Na samoj plaži nema besplatnog javnog WiFi-ja. Međutim, većina beach klubova i restorana uz šetnicu nudi besplatan WiFi svojim gostima. Mobilni signal u tom području je odličan, a većina EU posjetitelja može koristiti svoj kućni podatkovni paket zahvaljujući EU propisima o roamingu."
  de: "Am Strand selbst gibt es kein kostenloses öffentliches WLAN. Die meisten Strandclubs und Restaurants entlang der Promenade bieten ihren Gästen jedoch kostenloses WLAN an. Kroatische Mobilfunkdaten funktionieren in der Gegend gut, und die meisten EU-Besucher können dank der EU-Roaming-Verordnung ihren heimischen Datentarif nutzen."
  it: "Non c'è WiFi pubblico gratuito sulla spiaggia stessa. Tuttavia, la maggior parte dei beach club e dei ristoranti lungo il lungomare offre WiFi gratuito ai propri clienti. I dati mobili croati funzionano bene nella zona, e la maggior parte dei visitatori UE può utilizzare il proprio piano dati grazie al roaming UE."
  fr: "Il n'y a pas de WiFi public gratuit sur la plage elle-même. En revanche, la plupart des beach clubs et des restaurants le long de la promenade proposent un WiFi gratuit à leurs clients. La couverture mobile croate est excellente dans le secteur, et la plupart des visiteurs de l'UE peuvent utiliser leur forfait data habituel grâce à la réglementation européenne sur l'itinérance."
  es: "No hay WiFi público gratuito en la playa propiamente dicha. Sin embargo, la mayoría de los beach clubs y restaurantes del paseo marítimo ofrecen WiFi gratis a sus clientes. La cobertura de datos móviles en Croacia funciona muy bien en la zona, y la mayoría de los visitantes de la UE pueden usar su tarifa de datos habitual gracias a la normativa europea de itinerancia."
  pl: "Na samej plaży nie ma darmowego publicznego WiFi. Większość beach clubów i restauracji wzdłuż promenady oferuje jednak swoim gościom bezpłatne WiFi. Zasięg sieci komórkowej w okolicy jest bardzo dobry, a większość turystów z UE może korzystać ze swojego krajowego pakietu danych dzięki unijnym przepisom o roamingu."
  nl: "Op het strand zelf is er geen gratis openbare wifi. De meeste beachclubs en restaurants langs de promenade bieden hun gasten echter wel gratis wifi aan. Het Kroatische mobiele netwerk werkt uitstekend in dit gebied, en de meeste bezoekers uit de EU kunnen dankzij de EU-roamingregels gewoon hun eigen databundel gebruiken."
