id: parking-faq
question:
  en: "Is there parking at Žnjan Beach?"
  hr: "Ima li parking na plaži Žnjan?"
  de: "Gibt es Parkplätze am Strand Žnjan?"
  it: "C'è parcheggio alla spiaggia di Žnjan?"
  fr: "Y a-t-il un parking à la plage de Žnjan ?"
  es: "¿Hay aparcamiento en la playa de Žnjan?"
  pl: "Czy na plaży Žnjan jest parking?"
  nl: "Is er parkeergelegenheid bij het strand van Žnjan?"
answer:
  en: "Yes! Žnjan has a brand-new two-level underground garage with 530 spaces, plus 451 outdoor spaces — nearly 1,000 total. Parking costs €1 per hour (charges began July 16, 2025). Ten spaces are reserved for disabled drivers. The entire beach complex is a pedestrian-only zone, so you park and walk in. During peak summer months, arrive early as spaces fill quickly. Bus lines 8 and 15 are a convenient alternative from the city centre."
  hr: "Da! Žnjan ima potpuno novu podzemnu garažu na dva kata s 530 mjesta, plus 451 vanjsko mjesto — ukupno gotovo 1.000 mjesta. Parkiranje košta 1€ po satu (naplata počela 16. srpnja 2025.). Deset mjesta rezervirano je za osobe s invaliditetom. Cijeli plažni kompleks je pješačka zona, pa parkirate i šećete unutra. Tijekom ljetnih mjeseci dolazite rano jer se mjesta brzo popune. Autobusne linije 8 i 15 su praktična alternativa iz centra grada."
  de: "Ja! Žnjan hat eine brandneue zweistöckige Tiefgarage mit 530 Plätzen, plus 451 Außenparkplätze — insgesamt fast 1.000 Plätze. Das Parken kostet 1€ pro Stunde (Gebühren seit 16. Juli 2025). Zehn Plätze sind für Fahrer mit Behinderung reserviert. Der gesamte Strandkomplex ist eine Fußgängerzone. In den Sommermonaten kommen Sie früh, da die Plätze schnell belegt sind. Die Buslinien 8 und 15 sind eine bequeme Alternative aus der Innenstadt."
  it: "Sì! Žnjan ha un nuovissimo garage sotterraneo a due livelli con 530 posti, più 451 posti all'aperto — quasi 1.000 in totale. Il parcheggio costa 1€ all'ora (tariffe dal 16 luglio 2025). Dieci posti sono riservati ai conducenti con disabilità. L'intero complesso balneare è una zona pedonale. Durante i mesi estivi, arriva presto perché i posti si riempiono velocemente. Le linee 8 e 15 sono un'alternativa comoda dal centro città."
  fr: "Oui ! Žnjan dispose d'un tout nouveau parking souterrain sur deux niveaux de 530 places, ainsi que de 451 places en extérieur — près de 1 000 au total. Le stationnement coûte 1 € de l'heure (payant depuis le 16 juillet 2025). Dix places sont réservées aux conducteurs à mobilité réduite. L'ensemble du complexe balnéaire est une zone exclusivement piétonne : on se gare, puis on rejoint la plage à pied. En haute saison estivale, arrivez tôt car les places se remplissent vite. Les lignes de bus 8 et 15 constituent une alternative pratique depuis le centre-ville."
  es: "¡Sí! Žnjan cuenta con un flamante aparcamiento subterráneo de dos plantas con 530 plazas, más 451 plazas al aire libre: casi 1.000 en total. El aparcamiento cuesta 1 € por hora (de pago desde el 16 de julio de 2025). Diez plazas están reservadas para conductores con discapacidad. Todo el complejo de la playa es una zona exclusivamente peatonal, así que se aparca y se accede a pie. En los meses de máxima afluencia veraniega, llega pronto porque las plazas se llenan rápido. Las líneas de autobús 8 y 15 son una alternativa cómoda desde el centro de la ciudad."
  pl: "Tak! Žnjan dysponuje zupełnie nowym, dwupoziomowym parkingiem podziemnym na 530 miejsc oraz 451 miejscami na zewnątrz — łącznie blisko 1000. Parkowanie kosztuje 1 € za godzinę (opłaty obowiązują od 16 lipca 2025 r.). Dziesięć miejsc zarezerwowano dla kierowców z niepełnosprawnością. Cały kompleks plażowy jest strefą wyłącznie dla pieszych, więc zostawiasz auto i wchodzisz pieszo. W szczycie sezonu letniego przyjeżdżaj wcześnie, bo miejsca szybko się zapełniają. Linie autobusowe 8 i 15 to wygodna alternatywa z centrum miasta."
  nl: "Ja! Žnjan beschikt over een gloednieuwe ondergrondse parkeergarage met twee niveaus en 530 plaatsen, plus 451 plaatsen buiten — bijna 1.000 in totaal. Parkeren kost € 1 per uur (betaald sinds 16 juli 2025). Tien plaatsen zijn gereserveerd voor bestuurders met een beperking. Het hele strandcomplex is een autovrije zone: je parkeert en loopt naar binnen. Kom in de zomerse topmaanden vroeg, want de plaatsen raken snel vol. Buslijnen 8 en 15 zijn een handig alternatief vanuit het stadscentrum."
category: transport
order: 2
