description:
  en: "Mistral Beach Club combines modern beach lifestyle with authentic Dalmatian soul. Part of the Radisson Blu Resort & Spa complex on the Žnjan coast, it features a full-service restaurant with Mediterranean and international cuisine, sushi specialties, and a cocktail bar. Relax on sun loungers and daybeds on the pebble beach or wooden deck, book a private cabana, or enjoy live DJ performances. Food service extends directly to your lounger or cabana."
  hr: "Mistral Beach Club spaja moderan životni stil na plaži s autentičnom dalmatinskom dušom. Dio kompleksa Radisson Blu Resort & Spa na žnjanskoj obali, nudi restoran s kompletnom ponudom s mediteranskom i internacionalnom kuhinjom, sushi specijalitetima i koktel barom. Opustite se na ležaljkama na šljunčanoj plaži ili drvenoj terasi, rezervirajte privatnu kabanu ili uživajte u nastupima DJ-eva uživo. Hranu vam mogu poslužiti izravno do ležaljke ili kabane."
  de: "Der Mistral Beach Club verbindet modernen Strand-Lifestyle mit authentischer dalmatinischer Seele. Als Teil des Radisson Blu Resort & Spa Komplexes an der Žnjan-Küste bietet er ein Vollservice-Restaurant mit mediterraner und internationaler Küche, Sushi-Spezialitäten und eine Cocktailbar. Entspannen Sie auf Sonnenliegen und Tagesbetten am Kieselstrand oder der Holzterrasse, buchen Sie eine private Cabana oder genießen Sie Live-DJ-Auftritte."
  it: "Mistral Beach Club unisce lo stile di vita moderno in spiaggia con l'autentica anima dalmata. Parte del complesso Radisson Blu Resort & Spa sulla costa di Žnjan, offre un ristorante con servizio completo con cucina mediterranea e internazionale, specialità sushi e cocktail bar. Rilassatevi sui lettini e daybed sulla spiaggia di ciottoli o sulla terrazza in legno, prenotate una cabana privata o godetevi le performance di DJ dal vivo."
  fr: "Le Mistral Beach Club marie l'art de vivre balnéaire moderne et l'âme dalmate authentique. Intégré au complexe Radisson Blu Resort & Spa sur le littoral de Žnjan, il abrite un restaurant complet proposant une cuisine méditerranéenne et internationale, des spécialités sushi et un bar à cocktails. Détendez-vous sur les transats et lits de jour installés sur la plage de galets ou la terrasse en bois, réservez une cabana privée ou profitez des sets DJ en live. Le service de restauration est assuré directement à votre transat ou votre cabana."
  es: "El Mistral Beach Club fusiona el estilo de vida playero moderno con el alma dálmata más auténtica. Integrado en el complejo Radisson Blu Resort & Spa, en la costa de Žnjan, cuenta con un restaurante de servicio completo con cocina mediterránea e internacional, especialidades de sushi y un bar de cócteles. Relájate en las tumbonas y camas balinesas de la playa de guijarros o la terraza de madera, reserva una cabana privada o disfruta de las sesiones de DJ en directo. El servicio de comida llega directamente a tu hamaca o cabana."
  pl: "Mistral Beach Club łączy nowoczesny, plażowy styl życia z autentyczną dalmatyńską duszą. Stanowiąc część kompleksu Radisson Blu Resort & Spa na wybrzeżu Žnjan, oferuje restaurację z pełną obsługą serwującą kuchnię śródziemnomorską i międzynarodową, specjalności sushi oraz bar koktajlowy. Odpoczywaj na leżakach i łóżkach plażowych na żwirowej plaży lub drewnianym tarasie, zarezerwuj prywatną cabanę albo baw się przy występach DJ-ów na żywo. Posiłki serwowane są bezpośrednio przy Twoim leżaku lub w cabanie."
  nl: "Mistral Beach Club verenigt een moderne beachlifestyle met een authentieke Dalmatische ziel. Als onderdeel van het Radisson Blu Resort & Spa-complex aan de kust van Žnjan beschikt het over een fullservicerestaurant met mediterrane en internationale gerechten, sushispecialiteiten en een cocktailbar. Ontspan op de ligbedden en daybeds op het kiezelstrand of het houten terras, reserveer een privécabana of geniet van live dj-sets. De bediening brengt eten rechtstreeks naar je ligbed of cabana."
