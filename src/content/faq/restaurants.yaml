id: restaurants-at-znjan
question:
  en: "What restaurants and bars are at Žnjan Beach?"
  hr: "Koji restorani i barovi se nalaze na plaži Žnjan?"
  de: "Welche Restaurants und Bars gibt es am Strand Žnjan?"
  it: "Quali ristoranti e bar ci sono alla spiaggia di Žnjan?"
  fr: "Quels restaurants et bars trouve-t-on sur la plage de Žnjan ?"
  es: "¿Qué restaurantes y bares hay en la playa de Žnjan?"
  pl: "Jakie restauracje i bary znajdują się na plaży Žnjan?"
  nl: "Welke restaurants en bars zijn er op het strand van Žnjan?"
answer:
  en: "After the 2025 transformation, Žnjan Beach has 11 new pavilion buildings housing venues including: Palma Beach Club, Taboo Beach Club, Mistral Beach Club (at Radisson Blu), Casa Sol (Mediterranean/Italian), Central Beach (all-day dining), MIMI Italian Clubino (fine dining by F Group), and GAL Split (casual Mediterranean). More venues are expected to open as additional pavilion leases are finalised."
  hr: "Nakon transformacije 2025., plaža Žnjan ima 11 novih paviljona s lokalima uključujući: Palma Beach Club, Taboo Beach Club, Mistral Beach Club (pri Radisson Blu), Casa Sol (mediteranska/talijanska kuhinja), Central Beach (cjelodnevna ponuda), MIMI Italian Clubino (fine dining, F Group) i GAL Split (opuštena mediteranska kuhinja). Očekuje se otvaranje dodatnih lokala."
  de: "Nach der Transformation 2025 verfügt der Strand Žnjan über 11 neue Pavillongebäude mit Lokalen wie: Palma Beach Club, Taboo Beach Club, Mistral Beach Club (beim Radisson Blu), Casa Sol (mediterran/italienisch), Central Beach (Ganztags-Gastronomie), MIMI Italian Clubino (gehobene Küche, F Group) und GAL Split (ungezwungene mediterrane Küche). Weitere Lokale werden erwartet."
  it: "Dopo la trasformazione del 2025, la spiaggia di Žnjan ha 11 nuovi padiglioni con locali tra cui: Palma Beach Club, Taboo Beach Club, Mistral Beach Club (al Radisson Blu), Casa Sol (mediterraneo/italiano), Central Beach (ristorazione tutto il giorno), MIMI Italian Clubino (alta cucina, F Group) e GAL Split (cucina mediterranea informale). Si prevede l'apertura di altri locali."
  fr: "Après la transformation de 2025, la plage de Žnjan compte 11 nouveaux pavillons abritant des établissements comme : Palma Beach Club, Taboo Beach Club, Mistral Beach Club (au Radisson Blu), Casa Sol (cuisine méditerranéenne/italienne), Central Beach (restauration toute la journée), MIMI Italian Clubino (gastronomie raffinée signée F Group) et GAL Split (cuisine méditerranéenne décontractée). D'autres établissements devraient ouvrir à mesure que les baux des pavillons restants seront attribués."
  es: "Tras la transformación de 2025, la playa de Žnjan cuenta con 11 nuevos pabellones que albergan locales como: Palma Beach Club, Taboo Beach Club, Mistral Beach Club (en el Radisson Blu), Casa Sol (cocina mediterránea/italiana), Central Beach (gastronomía todo el día), MIMI Italian Clubino (alta cocina de F Group) y GAL Split (cocina mediterránea informal). Se espera la apertura de más locales a medida que se adjudiquen los arrendamientos de los pabellones restantes."
  pl: "Po przebudowie z 2025 roku na plaży Žnjan znajduje się 11 nowych pawilonów z lokalami, w tym: Palma Beach Club, Taboo Beach Club, Mistral Beach Club (przy Radisson Blu), Casa Sol (kuchnia śródziemnomorska/włoska), Central Beach (gastronomia przez cały dzień), MIMI Italian Clubino (kuchnia fine dining od F Group) oraz GAL Split (swobodna kuchnia śródziemnomorska). W miarę finalizowania umów najmu kolejnych pawilonów spodziewane jest otwarcie następnych lokali."
  nl: "Na de transformatie van 2025 telt het strand van Žnjan 11 nieuwe paviljoens met onder meer: Palma Beach Club, Taboo Beach Club, Mistral Beach Club (bij Radisson Blu), Casa Sol (mediterraans/Italiaans), Central Beach (de hele dag eten en drinken), MIMI Italian Clubino (fine dining van F Group) en GAL Split (ongedwongen mediterraans). Naarmate de huurcontracten voor de overige paviljoens worden afgerond, openen er naar verwachting nog meer zaken."
category: dining
