id: water-warm
question:
  en: "Is the water warm at Žnjan Beach?"
  hr: "Je li more toplo na plaži Žnjan?"
  de: "Ist das Wasser am Strand Žnjan warm?"
  it: "L'acqua è calda alla spiaggia di Žnjan?"
  fr: "L'eau est-elle chaude à la plage de Žnjan ?"
  es: "¿Está caliente el agua en la playa de Žnjan?"
  pl: "Czy woda na plaży Žnjan jest ciepła?"
  nl: "Is het water warm op het strand van Žnjan?"
answer:
  en: "The Adriatic water temperature at Žnjan ranges from about 18°C in May to 25–27°C in August. June through September is the main swimming season with comfortable temperatures of 21–26°C. September is particularly pleasant — warm sea from the summer heat with fewer crowds than July and August."
  hr: "Temperatura mora na Žnjanu kreće se od oko 18°C u svibnju do 25–27°C u kolovozu. Od lipnja do rujna je glavna sezona kupanja s ugodnim temperaturama od 21–26°C. Rujan je posebno ugodan — toplo more od ljetnih vrućina s manje gužve nego u srpnju i kolovozu."
  de: "Die Wassertemperatur der Adria am Žnjan reicht von etwa 18°C im Mai bis 25–27°C im August. Juni bis September ist die Hauptbadesaison mit angenehmen Temperaturen von 21–26°C. Der September ist besonders angenehm — warmes Meer von der Sommerhitze bei weniger Andrang als im Juli und August."
  it: "La temperatura dell'Adriatico a Žnjan varia da circa 18°C a maggio a 25–27°C ad agosto. Da giugno a settembre è la stagione balneare principale con temperature confortevoli di 21–26°C. Settembre è particolarmente piacevole — mare caldo dall'estate con meno folla rispetto a luglio e agosto."
  fr: "À Žnjan, la température de l'Adriatique passe d'environ 18°C en mai à 25–27°C en août. De juin à septembre, c'est la grande saison de baignade, avec des eaux agréables entre 21 et 26°C. Septembre est particulièrement plaisant : une mer réchauffée par la chaleur estivale et nettement moins de monde qu'en juillet et en août."
  es: "En Žnjan, la temperatura del Adriático va de unos 18°C en mayo a 25–27°C en agosto. De junio a septiembre es la temporada principal de baño, con aguas agradables de 21 a 26°C. Septiembre resulta especialmente placentero: un mar templado por el calor del verano y con menos gente que en julio y agosto."
  pl: "Temperatura Adriatyku w Žnjan waha się od około 18°C w maju do 25–27°C w sierpniu. Od czerwca do września trwa główny sezon kąpielowy z przyjemnymi temperaturami 21–26°C. Wrzesień jest wyjątkowo miły — morze rozgrzane letnim upałem, a przy tym znacznie mniej tłoczno niż w lipcu i sierpniu."
  nl: "De watertemperatuur van de Adriatische Zee bij Žnjan loopt op van zo'n 18°C in mei tot 25–27°C in augustus. Juni tot en met september is het belangrijkste zwemseizoen met aangename temperaturen van 21–26°C. September is bijzonder prettig: een door de zomerwarmte opgewarmde zee en duidelijk minder drukte dan in juli en augustus."
