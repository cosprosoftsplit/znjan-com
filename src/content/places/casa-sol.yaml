  - question:
      en: "What kind of food does Casa Sol serve?"
      hr: "Kakvu hranu poslužuje Casa Sol?"
      de: "Welche Küche bietet Casa Sol?"
      it: "Che tipo di cucina propone Casa Sol?"
      fr: "Quel type de cuisine propose Casa Sol ?"
      es: "¿Qué tipo de comida sirve Casa Sol?"
      pl: "Jaką kuchnię serwuje Casa Sol?"
      nl: "Wat voor eten serveert Casa Sol?"
    answer:
      en: "Modern Mediterranean cuisine built on locally sourced ingredients — breakfast and lunch menus, seasonal shared plates, a curated wine list and cocktails."
      hr: "Modernu mediteransku kuhinju temeljenu na lokalnim namirnicama — meni za doručak i ručak, sezonska jela za dijeljenje, pažljivo birana vinska karta i kokteli."
      de: "Moderne mediterrane Küche mit lokal bezogenen Zutaten — Frühstücks- und Mittagskarte, saisonale Gerichte zum Teilen, eine kuratierte Weinkarte und Cocktails."
      it: "Cucina mediterranea moderna a base di ingredienti locali — menu per colazione e pranzo, piatti stagionali da condividere, una carta dei vini curata e cocktail."
      fr: "Une cuisine méditerranéenne moderne à base de produits locaux — menus petit-déjeuner et déjeuner, plats de saison à partager, carte des vins soignée et cocktails."
      es: "Cocina mediterránea moderna con ingredientes de proximidad: menús de desayuno y almuerzo, platos de temporada para compartir, una cuidada carta de vinos y cócteles."
      pl: "Nowoczesną kuchnię śródziemnomorską opartą na lokalnych składnikach — menu śniadaniowe i lunchowe, sezonowe dania do dzielenia, starannie dobrana karta win i koktajle."
      nl: "Moderne mediterrane keuken met lokale ingrediënten — ontbijt- en lunchmenu's, seizoensgebonden gerechten om te delen, een zorgvuldig samengestelde wijnkaart en cocktails."
