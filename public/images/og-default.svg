<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#023e8a"/>
      <stop offset="40%" style="stop-color:#0077B6"/>
      <stop offset="100%" style="stop-color:#00B4D8"/>
    </linearGradient>
    <linearGradient id="sand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F4E8C1"/>
      <stop offset="100%" style="stop-color:#DEB887"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Sun -->
  <ellipse cx="1020" cy="110" rx="70" ry="70" fill="#FFD700" opacity="0.85"/>
  <!-- Waves -->
  <path d="M0 400 Q200 360 400 380 Q600 400 800 370 Q1000 340 1200 360 L1200 420 Q900 400 600 380 Q300 360 0 400 Z" fill="#90E0EF" opacity="0.4"/>
  <!-- Sand -->
  <path d="M0 440 Q300 410 600 425 Q900 440 1200 415 L1200 630 L0 630 Z" fill="url(#sand)"/>
  <!-- Wave detail -->
  <path d="M0 430 Q150 415 300 425 Q450 435 600 420 Q750 405 900 418 Q1050 430 1200 410" fill="none" stroke="white" stroke-width="1.5" opacity="0.3"/>
  <!-- Palm silhouettes -->
  <g opacity="0.15" fill="white">
    <path d="M100 440 Q95 380 90 340 Q80 300 60 280 Q90 310 100 340 Q110 310 140 280 Q120 300 110 340 Q105 380 100 440Z"/>
    <path d="M1120 420 Q1115 360 1110 320 Q1100 280 1080 260 Q1110 290 1120 320 Q1130 290 1160 260 Q1140 280 1130 320 Q1125 360 1120 420Z"/>
  </g>
  <!-- Main text -->
  <text x="600" y="220" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-weight="400" font-size="80" fill="white" letter-spacing="-1">Žnjan Beach</text>
  <!-- Divider -->
  <line x1="480" y1="248" x2="720" y2="248" stroke="white" stroke-width="2" opacity="0.5"/>
  <!-- Subtitle -->
  <text x="600" y="290" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="500" font-size="28" fill="white" opacity="0.9">Split, Croatia</text>
  <!-- Tagline -->
  <text x="600" y="340" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="22" fill="#90E0EF" opacity="0.9">The Complete Beach Guide — Activities, Places &amp; More</text>
  <!-- Domain badge -->
  <rect x="490" y="530" width="220" height="44" rx="22" fill="white" opacity="0.15"/>
  <text x="600" y="558" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="22" fill="white" opacity="0.95">znjan.com</text>
</svg>
