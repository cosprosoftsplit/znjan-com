description:
  en: "Mövenpick Hotel Žnjan will be the first Mövenpick hotel in Croatia — a 4-star urban beachfront resort opening for the 2026 season. Featuring 156 sea-view rooms across six above-ground floors, the €25M property includes a rooftop infinity pool with lounge and gourmet restaurant, full-service spa and wellness centre, gym, and conference facilities. With 110 parking spaces including EV charging stations, it represents the next chapter of the Žnjan transformation. Managed by Accor SA."
  hr: "Mövenpick Hotel Žnjan bit će prvi Mövenpick hotel u Hrvatskoj — urbani resort s 4 zvjezdice na plaži koji se otvara za sezonu 2026. S 156 soba s pogledom na more na šest nadzemnih etaža, objekt vrijedan 25 milijuna eura uključuje krovni infinity bazen s lounge barom i gurmanskim restoranom, spa i wellness centar, teretanu i konferencijske dvorane. Sa 110 parkirnih mjesta uključujući punionice za električna vozila, predstavlja sljedeće poglavlje transformacije Žnjana. Upravljanje: Accor SA."
  de: "Das Mövenpick Hotel Žnjan wird das erste Mövenpick-Hotel in Kroatien sein — ein urbanes 4-Sterne-Strandresort, das zur Saison 2026 eröffnet wird. Mit 156 Zimmern mit Meerblick auf sechs oberirdischen Etagen umfasst das 25-Millionen-Euro-Objekt einen Rooftop-Infinity-Pool mit Lounge und Gourmet-Restaurant, Vollservice-Spa und Wellnesscenter, Fitnessstudio und Konferenzeinrichtungen. Mit 110 Parkplätzen inklusive E-Ladestationen. Betrieben von Accor SA."
  it: "Il Mövenpick Hotel Žnjan sarà il primo hotel Mövenpick in Croazia — un resort urbano a 4 stelle fronte mare che aprirà per la stagione 2026. Con 156 camere con vista mare su sei piani fuori terra, la proprietà da 25 milioni di euro include una piscina infinity sul tetto con lounge e ristorante gourmet, spa e centro benessere, palestra e strutture per conferenze. Con 110 parcheggi incluse stazioni di ricarica EV. Gestito da Accor SA."
  fr: "Le Mövenpick Hotel Žnjan sera le tout premier hôtel Mövenpick de Croatie — un resort urbain 4 étoiles en bord de mer qui ouvrira ses portes pour la saison 2026. Avec ses 156 chambres vue mer réparties sur six étages hors sol, cet établissement de 25 M€ propose une piscine à débordement sur le toit avec lounge et restaurant gastronomique, un spa et centre de bien-être complet, une salle de sport et des espaces de conférence. Doté de 110 places de stationnement dont des bornes de recharge pour véhicules électriques, il incarne le prochain chapitre de la transformation de Žnjan. Géré par Accor SA."
  es: "El Mövenpick Hotel Žnjan será el primer hotel Mövenpick de Croacia: un resort urbano de 4 estrellas frente al mar que abrirá para la temporada 2026. Con 156 habitaciones con vistas al mar distribuidas en seis plantas sobre rasante, este establecimiento de 25 M€ cuenta con una piscina infinita en la azotea con lounge y restaurante gourmet, spa y centro de bienestar integral, gimnasio e instalaciones para conferencias. Con 110 plazas de aparcamiento, incluidos puntos de recarga para vehículos eléctricos, representa el siguiente capítulo de la transformación de Žnjan. Gestionado por Accor SA."
  pl: "Mövenpick Hotel Žnjan będzie pierwszym hotelem Mövenpick w Chorwacji — miejskim, czterogwiazdkowym kurortem przy plaży, który otworzy się na sezon 2026. Obiekt o wartości 25 mln € oferuje 156 pokoi z widokiem na morze na sześciu nadziemnych kondygnacjach, basen infinity na dachu z lounge barem i restauracją gourmet, kompleksowe spa i centrum wellness, siłownię oraz zaplecze konferencyjne. Ze 110 miejscami parkingowymi, w tym stacjami ładowania pojazdów elektrycznych, stanowi kolejny rozdział transformacji Žnjana. Zarządzany przez Accor SA."
  nl: "Mövenpick Hotel Žnjan wordt het allereerste Mövenpick-hotel in Kroatië — een stedelijk 4-sterrenresort aan zee dat opent voor het seizoen 2026. Met 156 kamers met zeezicht verdeeld over zes bovengrondse verdiepingen biedt het pand van 25 miljoen euro een rooftop infinity pool met lounge en gastronomisch restaurant, een volledig uitgerust spa- en wellnesscentrum, een fitnessruimte en vergaderfaciliteiten. Met 110 parkeerplaatsen inclusief laadpalen voor elektrische voertuigen vormt het het volgende hoofdstuk in de transformatie van Žnjan. Beheerd door Accor SA."
