id: swimming-season
question:
  en: "When is the best time to swim at Žnjan Beach?"
  hr: "Kada je najbolje vrijeme za kupanje na plaži Žnjan?"
  de: "Wann ist die beste Zeit zum Schwimmen am Strand Žnjan?"
  it: "Qual è il periodo migliore per nuotare alla spiaggia di Žnjan?"
  fr: "Quelle est la meilleure période pour se baigner à la plage de Žnjan ?"
  es: "¿Cuál es la mejor época para bañarse en la playa de Žnjan?"
  pl: "Kiedy najlepiej kąpać się na plaży Žnjan?"
  nl: "Wat is de beste tijd om te zwemmen op het strand van Žnjan?"
answer:
  en: "The best swimming season is June to September, when water temperatures range from 22°C to 26°C and lifeguards are on duty. May and October are also swimmable but cooler (18–21°C). Peak beach hours are 11am–4pm in summer; for a more relaxed experience, visit early morning or late afternoon. The eastern rocky end tends to be less crowded."
  hr: "Najbolja sezona za kupanje je od lipnja do rujna, kada su temperature vode od 22°C do 26°C i spasioci su na dužnosti. Svibanj i listopad su također pogodni za kupanje, ali hladniji (18–21°C). Vršni sati na plaži su od 11 do 16 sati ljeti; za opušteniji doživljaj, posjetite rano ujutro ili kasno poslijepodne. Kameni istočni dio obično je manje gužvast."
  de: "Die beste Badesaison ist von Juni bis September, wenn die Wassertemperaturen zwischen 22°C und 26°C liegen und Rettungsschwimmer im Dienst sind. Mai und Oktober sind auch zum Schwimmen geeignet, aber kühler (18–21°C). Die Stoßzeiten am Strand sind im Sommer von 11–16 Uhr; für ein ruhigeres Erlebnis besuchen Sie den Strand am frühen Morgen oder späten Nachmittag."
  it: "La migliore stagione per nuotare è da giugno a settembre, quando le temperature dell'acqua variano da 22°C a 26°C e i bagnini sono in servizio. Maggio e ottobre sono anch'essi adatti al nuoto ma più freschi (18–21°C). Le ore di punta in spiaggia sono dalle 11 alle 16 in estate; per un'esperienza più tranquilla, visitate al mattino presto o nel tardo pomeriggio."
  fr: "La meilleure saison de baignade s'étend de juin à septembre, lorsque la température de l'eau oscille entre 22 °C et 26 °C et que les sauveteurs sont de service. Mai et octobre permettent aussi de se baigner, mais l'eau y est plus fraîche (18–21 °C). En été, l'affluence est à son comble entre 11 h et 16 h ; pour profiter de la plage au calme, venez tôt le matin ou en fin d'après-midi. L'extrémité rocheuse à l'est est généralement moins fréquentée."
  es: "La mejor temporada de baño va de junio a septiembre, cuando la temperatura del agua oscila entre los 22 °C y los 26 °C y hay socorristas de servicio. Mayo y octubre también son aptos para el baño, aunque más frescos (18–21 °C). En verano, las horas de mayor afluencia son de 11:00 a 16:00; para una experiencia más tranquila, visita la playa a primera hora de la mañana o al final de la tarde. El extremo rocoso del este suele estar menos concurrido."
  pl: "Najlepszy sezon kąpielowy trwa od czerwca do września, gdy temperatura wody waha się od 22°C do 26°C, a na plaży dyżurują ratownicy. Maj i październik również nadają się do kąpieli, choć woda jest chłodniejsza (18–21°C). Latem największy tłok panuje od 11:00 do 16:00; aby odpocząć w spokoju, przyjdź wczesnym rankiem lub późnym popołudniem. Skalisty wschodni kraniec plaży bywa mniej zatłoczony."
  nl: "Het beste zwemseizoen loopt van juni tot september, wanneer de watertemperatuur tussen 22 °C en 26 °C ligt en er badmeesters aanwezig zijn. Ook in mei en oktober kun je zwemmen, al is het water dan koeler (18–21 °C). In de zomer is het het drukst tussen 11.00 en 16.00 uur; voor een rustigere ervaring kom je het best vroeg in de ochtend of laat in de middag. Het rotsachtige oostelijke uiteinde is doorgaans minder druk."
