id: accessibility
question:
  en: "Is Žnjan Beach accessible for people with disabilities?"
  hr: "Je li plaža Žnjan pristupačna za osobe s invaliditetom?"
  de: "Ist der Strand Žnjan barrierefrei zugänglich?"
  it: "La spiaggia di Žnjan è accessibile alle persone con disabilità?"
  fr: "La plage de Žnjan est-elle accessible aux personnes à mobilité réduite ?"
  es: "¿Es accesible la playa de Žnjan para personas con discapacidad?"
  pl: "Czy plaża Žnjan jest dostępna dla osób z niepełnosprawnościami?"
  nl: "Is het strand van Žnjan toegankelijk voor mensen met een beperking?"
answer:
  en: "Yes — Žnjan is one of Croatia's most accessible beaches. The accessible beach zone actually opened in summer 2024, a year before the main beach. It features a hydraulic sea-access elevator for swimmers with mobility challenges, floating safety barriers, adapted WC and changing cabins, trained assistants, and beach umbrellas. The underground garage has 10 reserved disabled parking spaces connected to the beach by an accessible path. The full 2+ km promenade is flat, fully paved, and suitable for wheelchairs and mobility scooters."
  hr: "Da — Žnjan je jedna od najpristupačnijih plaža u Hrvatskoj. Pristupačna zona plaže zapravo je otvorena ljeti 2024., godinu dana prije glavne plaže. Ima hidraulični lift za ulazak u more za kupače smanjene pokretljivosti, plutajuće sigurnosne barijere, prilagođeni WC i kabine za presvlačenje, obučene asistente i suncobrane. Podzemna garaža ima 10 rezerviranih mjesta za osobe s invaliditetom povezanih s plažom pristupačnom stazom. Cijela šetnica od 2+ km je ravna, potpuno popločena i prikladna za invalidska kolica."
  de: "Ja — Žnjan ist einer der barrierefreiesten Strände Kroatiens. Die barrierefreie Strandzone wurde tatsächlich im Sommer 2024 eröffnet, ein Jahr vor dem Hauptstrand. Sie verfügt über einen hydraulischen Meereszugangslift für Schwimmer mit Mobilitätseinschränkungen, schwimmende Sicherheitsbarrieren, angepasste WC und Umkleidekabinen, geschulte Assistenten und Sonnenschirme. Die Tiefgarage hat 10 reservierte Behindertenparkplätze mit barrierefreiem Zugang zum Strand. Die gesamte 2+ km Promenade ist flach, vollständig gepflastert und für Rollstühle und Mobilitätsroller geeignet."
  it: "Sì — Žnjan è una delle spiagge più accessibili della Croazia. La zona spiaggia accessibile è stata aperta nell'estate 2024, un anno prima della spiaggia principale. Dispone di un ascensore idraulico per l'accesso al mare, barriere di sicurezza galleggianti, WC e cabine spogliatoio adattati, assistenti formati e ombrelloni. Il garage sotterraneo ha 10 posti riservati ai disabili collegati alla spiaggia da un percorso accessibile. L'intero lungomare di 2+ km è pianeggiante, completamente pavimentato e adatto a sedie a rotelle e scooter per la mobilità."
  fr: "Oui — Žnjan est l'une des plages les plus accessibles de Croatie. La zone de baignade accessible a en réalité ouvert dès l'été 2024, un an avant la plage principale. Elle dispose d'un élévateur hydraulique d'accès à la mer pour les baigneurs à mobilité réduite, de barrières de sécurité flottantes, de toilettes et de cabines de change adaptées, d'assistants formés et de parasols. Le parking souterrain compte 10 places réservées aux personnes handicapées, reliées à la plage par un cheminement accessible. L'ensemble de la promenade de plus de 2 km est plat, entièrement pavé et adapté aux fauteuils roulants et aux scooters de mobilité."
  es: "Sí — Žnjan es una de las playas más accesibles de Croacia. La zona de playa accesible se inauguró en el verano de 2024, un año antes que la playa principal. Cuenta con un elevador hidráulico de acceso al mar para bañistas con movilidad reducida, barreras de seguridad flotantes, aseos y cabinas de cambio adaptados, asistentes capacitados y sombrillas. El aparcamiento subterráneo dispone de 10 plazas reservadas para personas con discapacidad, conectadas con la playa mediante un camino accesible. Todo el paseo marítimo de más de 2 km es llano, está completamente pavimentado y es apto para sillas de ruedas y scooters de movilidad."
  pl: "Tak — Žnjan to jedna z najbardziej dostępnych plaż w Chorwacji. Dostępna strefa plaży została otwarta już latem 2024 roku, rok przed główną plażą. Wyposażona jest w hydrauliczną windę umożliwiającą wejście do morza osobom o ograniczonej mobilności, pływające bariery bezpieczeństwa, dostosowane WC i kabiny do przebierania, przeszkolonych asystentów oraz parasole plażowe. W podziemnym parkingu znajduje się 10 zarezerwowanych miejsc dla osób z niepełnosprawnościami, połączonych z plażą dostępną ścieżką. Cała promenada o długości ponad 2 km jest płaska, w pełni wybrukowana i odpowiednia dla wózków inwalidzkich oraz skuterów dla osób o ograniczonej mobilności."
  nl: "Ja — Žnjan is een van de meest toegankelijke stranden van Kroatië. De toegankelijke strandzone opende al in de zomer van 2024, een jaar vóór het hoofdstrand. De zone beschikt over een hydraulische zee-toegangslift voor zwemmers met een beperkte mobiliteit, drijvende veiligheidsbarrières, aangepaste toiletten en kleedcabines, getrainde assistenten en parasols. De ondergrondse parkeergarage heeft 10 gereserveerde gehandicaptenparkeerplaatsen die via een toegankelijk pad met het strand zijn verbonden. De volledige promenade van meer dan 2 km is vlak, volledig bestraat en geschikt voor rolstoelen en scootmobielen."
