description:
  en: "The main stretch of Žnjan Beach — Split's largest beach spanning over 2 km of coastline. Recently transformed with a €45.77M investment, the pebble beach features crystal-clear Adriatic waters, sunbed rentals, lifeguard stations, and a new 1.7 km palm-lined promenade. The beach complex includes an underground garage with 530 parking spaces."
  hr: "Glavni dio plaže Žnjan — najveća plaža u Splitu koja se proteže na više od 2 km obale. Nedavno obnovljena ulaganjem od 45,77 milijuna eura, šljunčana plaža nudi kristalno čisto Jadransko more, najam ležaljki, spasilačke postaje i novu šetnicu od 1,7 km s palmama. Plažni kompleks uključuje podzemnu garažu s 530 parkirnih mjesta."
  de: "Der Hauptabschnitt des Strandes Žnjan — Splits größter Strand mit über 2 km Küstenlinie. Kürzlich mit einer 45-Millionen-Euro-Investition umgestaltet, bietet der Kieselstrand kristallklares Adriawasser, Liegestuhlverleih, Rettungsschwimmerstationen und eine neue 1,7 km lange palmengesäumte Promenade. Der Strandkomplex umfasst eine Tiefgarage mit 530 Parkplätzen."
  it: "Il tratto principale della spiaggia di Žnjan — la più grande di Spalato con oltre 2 km di costa. Recentemente trasformata con un investimento di 45 milioni di euro, la spiaggia di ciottoli offre acque adriatiche cristalline, noleggio lettini, postazioni di salvataggio e un nuovo lungomare di 1,7 km con palme. Il complesso balneare include un garage sotterraneo con 530 posti auto."
  fr: "La partie principale de la plage de Žnjan — la plus grande de Split, s'étirant sur plus de 2 km de littoral. Récemment réaménagée grâce à un investissement de 45,77 M€, cette plage de galets offre les eaux cristallines de l'Adriatique, la location de transats, des postes de secours et une nouvelle promenade de 1,7 km bordée de palmiers. Le complexe balnéaire comprend un parking souterrain de 530 places."
  es: "El tramo principal de la playa de Žnjan — la mayor de Split, con más de 2 km de litoral. Recientemente transformada con una inversión de 45,77 M€, esta playa de guijarros ofrece las aguas cristalinas del Adriático, alquiler de tumbonas, puestos de socorrismo y un nuevo paseo marítimo de 1,7 km flanqueado de palmeras. El complejo de playa incluye un aparcamiento subterráneo con 530 plazas."
  pl: "Główny odcinek plaży Žnjan — największej plaży Splitu, ciągnącej się przez ponad 2 km wybrzeża. Niedawno przebudowana dzięki inwestycji 45,77 mln euro, ta żwirowa plaża oferuje krystalicznie czyste wody Adriatyku, wypożyczalnię leżaków, stanowiska ratowników oraz nową, obsadzoną palmami promenadę o długości 1,7 km. Kompleks plażowy obejmuje podziemny parking na 530 miejsc."
  nl: "Het hoofdgedeelte van het strand van Žnjan — het grootste strand van Split, met meer dan 2 km kustlijn. Onlangs vernieuwd met een investering van 45,77 miljoen euro biedt dit kiezelstrand kristalheldere Adriatische wateren, ligstoelverhuur, reddingsposten en een nieuwe, met palmen omzoomde boulevard van 1,7 km. Het strandcomplex beschikt over een ondergrondse parkeergarage met 530 plaatsen."
