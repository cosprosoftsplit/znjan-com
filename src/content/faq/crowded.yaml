id: crowded
question:
  en: "Is Žnjan Beach crowded? When is the best time to avoid crowds?"
  hr: "Je li plaža Žnjan gužvasta? Kad je najbolje doći da izbjegnete gužvu?"
  de: "Ist der Strand Žnjan überfüllt? Wann ist die beste Zeit, um Menschenmengen zu vermeiden?"
  it: "La spiaggia di Žnjan è affollata? Quando è il momento migliore per evitare la folla?"
  fr: "La plage de Žnjan est-elle bondée ? Quel est le meilleur moment pour éviter la foule ?"
  es: "¿Está concurrida la playa de Žnjan? ¿Cuál es la mejor hora para evitar las aglomeraciones?"
  pl: "Czy plaża Žnjan jest zatłoczona? Kiedy najlepiej przyjść, aby uniknąć tłumów?"
  nl: "Is het strand van Žnjan druk? Wat is het beste moment om de drukte te vermijden?"
answer:
  en: "Žnjan gets busy in July and August, especially on weekends between 11am and 4pm. However, at 2+ km long it absorbs crowds better than smaller beaches. To avoid peak crowds: visit in June or September, arrive before 9am, or come in the late afternoon (after 5pm) when many people leave. Weekdays are significantly quieter than weekends."
  hr: "Žnjan je gužvast u srpnju i kolovozu, osobito vikendom između 11 i 16 sati. Međutim, s duljinom od 2+ km gužve se bolje rasporede nego na manjim plažama. Za izbjegavanje vršne gužve: posjetite u lipnju ili rujnu, dođite prije 9 ujutro ili kasno poslijepodne (nakon 17h) kad mnogi odlaze. Radnim danima je znatno mirnije nego vikendom."
  de: "Žnjan ist im Juli und August gut besucht, besonders an Wochenenden zwischen 11 und 16 Uhr. Mit über 2 km Länge verteilen sich die Besucher jedoch besser als an kleineren Stränden. Um Spitzenzeiten zu vermeiden: Besuchen Sie den Strand im Juni oder September, kommen Sie vor 9 Uhr oder am späten Nachmittag (nach 17 Uhr). Wochentags ist es deutlich ruhiger als am Wochenende."
  it: "Žnjan è affollata a luglio e agosto, soprattutto nei fine settimana tra le 11 e le 16. Tuttavia, con oltre 2 km di lunghezza assorbe la folla meglio delle spiagge più piccole. Per evitare il picco: visitate a giugno o settembre, arrivate prima delle 9 del mattino, o venite nel tardo pomeriggio (dopo le 17) quando molti se ne vanno. I giorni feriali sono significativamente più tranquilli dei fine settimana."
  fr: "Žnjan est très fréquentée en juillet et en août, surtout le week-end entre 11h et 16h. Mais avec plus de 2 km de long, elle absorbe la foule bien mieux que les plages plus petites. Pour éviter l'affluence : venez en juin ou en septembre, arrivez avant 9h, ou présentez-vous en fin d'après-midi (après 17h), quand beaucoup de gens repartent. En semaine, c'est nettement plus calme que le week-end."
  es: "Žnjan se llena en julio y agosto, sobre todo los fines de semana entre las 11:00 y las 16:00. Sin embargo, con más de 2 km de longitud absorbe las aglomeraciones mucho mejor que las playas más pequeñas. Para esquivar las horas punta: ve en junio o septiembre, llega antes de las 9:00 o acércate a última hora de la tarde (después de las 17:00), cuando mucha gente se marcha. Entre semana hay bastante menos ambiente que los fines de semana."
  pl: "Plaża Žnjan robi się tłoczna w lipcu i sierpniu, zwłaszcza w weekendy między 11:00 a 16:00. Jednak przy ponad 2 km długości rozprasza tłumy znacznie lepiej niż mniejsze plaże. Aby uniknąć największego ruchu: przyjedź w czerwcu lub wrześniu, dotrzyj przed 9:00 albo wpadnij późnym popołudniem (po 17:00), gdy wiele osób już wychodzi. W dni robocze jest wyraźnie spokojniej niż w weekendy."
  nl: "Žnjan is in juli en augustus erg druk, vooral in het weekend tussen 11.00 en 16.00 uur. Maar met ruim 2 km lengte vangt het strand de drukte veel beter op dan kleinere stranden. Om de piekdrukte te vermijden: kom in juni of september, arriveer vóór 9.00 uur, of kom laat in de middag (na 17.00 uur), wanneer veel mensen vertrekken. Doordeweeks is het beduidend rustiger dan in het weekend."
