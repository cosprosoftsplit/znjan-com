id: lifeguards
question:
  en: "Are there lifeguards at Žnjan Beach?"
  hr: "Ima li spasilaca na plaži Žnjan?"
  de: "Gibt es Rettungsschwimmer am Strand Žnjan?"
  it: "Ci sono bagnini alla spiaggia di Žnjan?"
  fr: "Y a-t-il des maîtres-nageurs à la plage de Žnjan ?"
  es: "¿Hay socorristas en la playa de Žnjan?"
  pl: "Czy na plaży Žnjan są ratownicy?"
  nl: "Zijn er badmeesters op het strand van Žnjan?"
answer:
  en: "Yes, lifeguards are on duty during the summer season (typically June to September) at the main beach and kids' zone. Outside of these months, there are no lifeguards. Always supervise children near the water and be aware that some areas get deep quickly."
  hr: "Da, spasilaci su na dužnosti tijekom ljetne sezone (obično od lipnja do rujna) na glavnoj plaži i u dječjoj zoni. Izvan tih mjeseci nema spasilaca. Uvijek nadgledajte djecu blizu vode i budite svjesni da neka područja brzo postaju duboka."
  de: "Ja, Rettungsschwimmer sind während der Sommersaison (in der Regel Juni bis September) am Hauptstrand und in der Kinderzone im Einsatz. Außerhalb dieser Monate gibt es keine Rettungsschwimmer. Beaufsichtigen Sie Kinder immer in Wassernähe und beachten Sie, dass einige Bereiche schnell tief werden."
  it: "Sì, i bagnini sono in servizio durante la stagione estiva (generalmente da giugno a settembre) sulla spiaggia principale e nella zona bambini. Al di fuori di questi mesi non ci sono bagnini. Supervisionate sempre i bambini vicino all'acqua e siate consapevoli che alcune zone diventano profonde rapidamente."
  fr: "Oui, des maîtres-nageurs sont en service pendant la saison estivale (généralement de juin à septembre) sur la plage principale et dans la zone enfants. En dehors de ces mois, il n'y a pas de surveillance. Surveillez toujours les enfants près de l'eau et sachez que certaines zones deviennent rapidement profondes."
  es: "Sí, hay socorristas de servicio durante la temporada de verano (normalmente de junio a septiembre) en la playa principal y en la zona infantil. Fuera de estos meses no hay socorristas. Vigile siempre a los niños cerca del agua y tenga en cuenta que algunas zonas se vuelven profundas rápidamente."
  pl: "Tak, ratownicy pełnią dyżur w sezonie letnim (zazwyczaj od czerwca do września) na plaży głównej i w strefie dla dzieci. Poza tymi miesiącami nie ma ratowników. Zawsze nadzoruj dzieci w pobliżu wody i pamiętaj, że niektóre miejsca szybko stają się głębokie."
  nl: "Ja, er zijn badmeesters aanwezig tijdens het zomerseizoen (doorgaans van juni tot september) op het hoofdstrand en in de kinderzone. Buiten deze maanden is er geen toezicht. Houd kinderen altijd in de gaten bij het water en houd er rekening mee dat sommige plekken snel diep worden."
