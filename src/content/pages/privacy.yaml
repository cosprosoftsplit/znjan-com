description:
  en: "Znjan.com privacy policy — how we handle your data."
  hr: "Politika privatnosti Znjan.com — kako postupamo s vašim podacima."
  de: "Datenschutzrichtlinie von Znjan.com — wie wir mit Ihren Daten umgehen."
  it: "Informativa sulla privacy di Znjan.com — come gestiamo i tuoi dati."
content:
  en: "Znjan.com respects your privacy. This policy explains how we handle information across the public website and community features.\n\n**Public browsing:** You can browse guides, places, beach areas, and sports access information without creating an account. The sports access pages explain that the public sports areas are free to use, have no current reservation system, and operate on a first-come, first-served basis.\n\n**Accounts and sign-in:** If you sign in with Google, we store the minimum account data needed to run the community, such as your email address, display name, Google subject identifier, and secure session records.\n\n**Community content:** Posts, comments, profile display names, and other participation signals are part of a public community product. Do not post information you want to keep private.\n\n**Moderation and admin access:** Approved admins may access the moderation and operational data needed to review community content, investigate reported issues, and manage public updates.\n\n**Analytics:** We use Cloudflare Web Analytics, which does not use marketing cookies and does not create personally identifiable analytics profiles. We review aggregate traffic and performance data.\n\n**Sessions and security:** We do not use advertising cookies. If you sign in, we use secure session cookies so the website can keep you signed in and protect your account.\n\n**Contact and support messages:** If you email us or use a contact flow, we process the information you send only to respond, investigate operational issues, or keep the directory accurate.\n\n**Third-party services:** We rely on Google OAuth for sign-in and OpenStreetMap for maps. Affiliate partners or external services you click may apply their own privacy policies.\n\n**Your rights:** Under GDPR, you can request access, correction, export, or deletion of personal data we hold about you. Contact privacy@znjan.com for privacy requests or info@znjan.com for operational and directory issues."
  hr: "Znjan.com poštuje vašu privatnost. Ova politika objašnjava kako postupamo s informacijama na javnoj web stranici i u funkcijama zajednice.\n\n**Javno pregledavanje:** Vodiče, mjesta, zone plaže i informacije o sportskom pristupu možete pregledavati bez otvaranja računa. Stranice o sportskom pristupu objašnjavaju da su javne sportske zone besplatne, da trenutačno ne postoji sustav rezervacija i da rade po principu tko prvi dođe, prvi koristi.\n\n**Račun i prijava:** Ako se prijavite putem Googlea, pohranjujemo minimalne podatke potrebne za rad zajednice, poput email adrese, javnog imena, Google identifikatora i sigurnih zapisa sesije.\n\n**Sadržaj zajednice:** Objave, komentari, javna imena profila i drugi signali sudjelovanja dio su javnog proizvoda zajednice. Nemojte objavljivati informacije koje želite zadržati privatnima.\n\n**Moderacija i admin pristup:** Odobreni administratori mogu pristupiti podacima potrebnima za moderaciju zajednice, provjeru prijavljenih problema i upravljanje javnim informacijama.\n\n**Analitika:** Koristimo Cloudflare Web Analytics, koji ne koristi marketinške kolačiće i ne stvara analitičke profile povezane s identitetom osobe. Pregledavamo samo agregirane podatke o prometu i performansama.\n\n**Sesije i sigurnost:** Ne koristimo oglašivačke kolačiće. Ako se prijavite, koristimo sigurne kolačiće sesije kako bi vas web stranica mogla zadržati prijavljenima i zaštititi vaš račun.\n\n**Kontakt i poruke podrške:** Ako nam pošaljete email ili koristite kontaktni kanal, obrađujemo podatke koje pošaljete samo kako bismo odgovorili, istražili operativni problem ili održavali točnost direktorija.\n\n**Usluge trećih strana:** Za prijavu koristimo Google OAuth, a za karte OpenStreetMap. Affiliate partneri ili vanjske usluge na koje kliknete mogu primjenjivati vlastite politike privatnosti.\n\n**Vaša prava:** Prema GDPR-u možete zatražiti pristup, ispravak, izvoz ili brisanje osobnih podataka koje imamo o vama. Za upite o privatnosti javite se na privacy@znjan.com, a za operativne i direktorske probleme na info@znjan.com."
  de: "Znjan.com respektiert Ihre Privatsphäre. Diese Richtlinie erklärt, wie wir Informationen auf der öffentlichen Website und in den Community-Funktionen verarbeiten.\n\n**Öffentliches Browsing:** Sie können Guides, Orte, Strandbereiche und Informationen zum Sportzugang durchsuchen, ohne ein Konto anzulegen. Die Sportzugangsseiten erklären, dass die öffentlichen Sportflächen kostenlos nutzbar sind, derzeit kein Reservierungssystem besteht und alles nach dem Prinzip 'wer zuerst kommt, spielt zuerst' funktioniert.\n\n**Konto und Anmeldung:** Wenn Sie sich mit Google anmelden, speichern wir die Mindestdaten, die für die Community nötig sind, etwa Ihre E-Mail-Adresse, Ihren Anzeigenamen, die Google-Sub-ID und sichere Sitzungsdaten.\n\n**Community-Inhalte:** Beiträge, Kommentare, öffentliche Profilnamen und andere Teilnahmesignale sind Teil eines öffentlichen Community-Produkts. Veröffentlichen Sie daher keine Informationen, die privat bleiben sollen.\n\n**Moderation und Admin-Zugriff:** Freigegebene Administratoren können auf Moderations- und Betriebsdaten zugreifen, die nötig sind, um Community-Inhalte zu prüfen, gemeldete Probleme zu untersuchen und öffentliche Hinweise zu verwalten.\n\n**Analytik:** Wir verwenden Cloudflare Web Analytics. Dabei werden keine Marketing-Cookies genutzt und keine personenbezogenen Analyseprofile erstellt. Wir betrachten nur aggregierte Traffic- und Leistungsdaten.\n\n**Sitzungen und Sicherheit:** Wir verwenden keine Werbe-Cookies. Wenn Sie sich anmelden, nutzen wir sichere Sitzungs-Cookies, damit die Website Sie angemeldet halten und Ihr Konto schützen kann.\n\n**Kontakt- und Supportnachrichten:** Wenn Sie uns eine E-Mail senden oder einen Kontaktweg nutzen, verarbeiten wir Ihre Angaben nur, um zu antworten, operative Probleme zu untersuchen oder das Verzeichnis korrekt zu halten.\n\n**Drittanbieter-Dienste:** Für die Anmeldung setzen wir Google OAuth ein, für Karten OpenStreetMap. Affiliate-Partner oder externe Dienste, die Sie anklicken, können eigene Datenschutzrichtlinien anwenden.\n\n**Ihre Rechte:** Nach DSGVO können Sie Zugang, Berichtigung, Export oder Löschung der personenbezogenen Daten verlangen, die wir über Sie gespeichert haben. Schreiben Sie für Datenschutzanfragen an privacy@znjan.com und für operative oder Verzeichnisprobleme an info@znjan.com."
  it: "Znjan.com rispetta la tua privacy. Questa policy spiega come gestiamo le informazioni sul sito pubblico e nelle funzioni della community.\n\n**Navigazione pubblica:** Puoi consultare guide, luoghi, aree della spiaggia e informazioni sull'accesso sportivo senza creare un account. Le pagine dedicate allo sport spiegano che le aree sportive pubbliche sono gratuite, che al momento non esiste un sistema di prenotazione e che tutto funziona in base al principio del primo arrivato, primo servito.\n\n**Account e accesso:** Se accedi con Google, conserviamo solo i dati minimi necessari per far funzionare la community, come indirizzo email, nome visualizzato, identificatore Google e record di sessione sicuri.\n\n**Contenuti della community:** Post, commenti, nomi profilo pubblici e altri segnali di partecipazione fanno parte di un prodotto community pubblico. Non pubblicare informazioni che vuoi mantenere private.\n\n**Moderazione e accesso admin:** Gli amministratori approvati possono accedere ai dati di moderazione e operativi necessari per rivedere i contenuti della community, indagare problemi segnalati e gestire avvisi pubblici.\n\n**Analytics:** Utilizziamo Cloudflare Web Analytics, che non usa cookie di marketing e non crea profili analitici riconducibili alla persona. Consultiamo solo dati aggregati di traffico e prestazioni.\n\n**Sessioni e sicurezza:** Non utilizziamo cookie pubblicitari. Se accedi, usiamo cookie di sessione sicuri così il sito può mantenerti autenticato e proteggere il tuo account.\n\n**Messaggi di contatto e supporto:** Se ci scrivi via email o usi un canale di contatto, trattiamo le informazioni inviate solo per rispondere, indagare un problema operativo o mantenere accurato il directory.\n\n**Servizi di terze parti:** Per l'accesso utilizziamo Google OAuth e per le mappe OpenStreetMap. Partner affiliati o servizi esterni che apri possono applicare le proprie policy privacy.\n\n**I tuoi diritti:** Ai sensi del GDPR puoi richiedere accesso, correzione, esportazione o cancellazione dei dati personali che conserviamo su di te. Contatta privacy@znjan.com per richieste privacy oppure info@znjan.com per problemi operativi o del directory."
