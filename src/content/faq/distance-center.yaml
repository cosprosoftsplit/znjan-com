id: distance-center
question:
  en: "How far is Žnjan Beach from Split city centre?"
  hr: "Koliko je plaža Žnjan udaljena od centra Splita?"
  de: "Wie weit ist der Strand Žnjan vom Stadtzentrum Splits entfernt?"
  it: "Quanto dista la spiaggia di Žnjan dal centro di Spalato?"
  fr: "À quelle distance la plage de Žnjan se trouve-t-elle du centre-ville de Split ?"
  es: "¿A qué distancia está la playa de Žnjan del centro de Split?"
  pl: "Jak daleko jest plaża Žnjan od centrum Splitu?"
  nl: "Hoe ver ligt het strand van Žnjan van het centrum van Split?"
answer:
  en: "Žnjan Beach is approximately 4 km east of Diocletian's Palace (Split Old Town). By bus (lines 8 or 15) it takes about 15 minutes. By taxi or Uber it's a 10-minute ride costing €6–9. Walking takes about 45–60 minutes along the coastal promenade."
  hr: "Plaža Žnjan udaljena je oko 4 km istočno od Dioklecijanove palače (Stari grad). Autobusom (linije 8 ili 15) vožnja traje oko 15 minuta. Taksijem ili Uberom traje oko 10 minuta i košta 6–9 €. Pješice traje oko 45–60 minuta duž obalne šetnice."
  de: "Der Strand Žnjan liegt etwa 4 km östlich des Diokletianpalasts (Altstadt von Split). Mit dem Bus (Linien 8 oder 15) dauert es etwa 15 Minuten. Mit dem Taxi oder Uber sind es 10 Minuten für 6–9 €. Zu Fuß dauert es etwa 45–60 Minuten entlang der Küstenpromenade."
  it: "La spiaggia di Žnjan si trova a circa 4 km a est del Palazzo di Diocleziano (centro storico di Spalato). In autobus (linee 8 o 15) ci vogliono circa 15 minuti. In taxi o Uber sono 10 minuti per €6–9. A piedi ci vogliono circa 45–60 minuti lungo il lungomare costiero."
  fr: "La plage de Žnjan se situe à environ 4 km à l'est du palais de Dioclétien (vieille ville de Split). En bus (lignes 8 ou 15), comptez une quinzaine de minutes. En taxi ou en Uber, le trajet dure 10 minutes et coûte 6 à 9 €. À pied, prévoyez environ 45 à 60 minutes le long de la promenade du bord de mer."
  es: "La playa de Žnjan se encuentra a unos 4 km al este del Palacio de Diocleciano (casco antiguo de Split). En autobús (líneas 8 o 15) el trayecto dura unos 15 minutos. En taxi o Uber son 10 minutos y cuesta entre 6 y 9 €. A pie se tarda unos 45–60 minutos por el paseo marítimo."
  pl: "Plaża Žnjan leży około 4 km na wschód od Pałacu Dioklecjana (Stare Miasto w Splicie). Autobusem (linie 8 lub 15) dojazd zajmuje około 15 minut. Taksówką lub Uberem to 10 minut za 6–9 €. Pieszo trasa nadmorską promenadą trwa około 45–60 minut."
  nl: "Het strand van Žnjan ligt ongeveer 4 km ten oosten van het Diocletianuspaleis (de oude binnenstad van Split). Met de bus (lijn 8 of 15) duurt het ongeveer 15 minuten. Met een taxi of Uber ben je er in 10 minuten voor € 6–9. Te voet loop je er in ongeveer 45–60 minuten naartoe over de kustpromenade."
