description:
  en: "Explore the coastline around Žnjan Beach by kayak. If you bring your own kayak, the public shoreline lets you paddle along the coast, discovering coves and sea views without a reservation system, on a first-come, first-served basis."
  hr: "Istražite obalu oko plaže Žnjan kajakom. Ako ponesete vlastiti kajak, javna obala omogućuje vam veslanje uz obalu i otkrivanje uvala i pogleda na more bez sustava rezervacija, po principu tko prvi dođe, prvi koristi."
  de: "Erkunden Sie die Küste rund um den Strand Žnjan mit dem Kajak. Wenn Sie Ihr eigenes Kajak mitbringen, können Sie entlang der öffentlichen Uferlinie paddeln und Buchten sowie Meerblicke ohne Reservierungssystem nach dem Prinzip 'wer zuerst kommt, nutzt zuerst' entdecken."
  it: "Esplora la costa intorno alla spiaggia di Žnjan in kayak. Se porti il tuo kayak, la riva pubblica ti permette di pagaiare lungo la costa e scoprire calette e scorci sul mare senza sistema di prenotazione, in base al principio del primo arrivato, primo servito."
  fr: "Explorez le littoral autour de la plage de Žnjan en kayak. Si vous apportez votre propre kayak, le rivage public vous permet de pagayer le long de la côte et de découvrir criques et panoramas sur la mer, sans système de réservation, selon le principe du premier arrivé, premier servi."
  es: "Explora el litoral que rodea la playa de Žnjan en kayak. Si traes tu propio kayak, la orilla pública te permite remar a lo largo de la costa y descubrir calas y vistas al mar sin sistema de reservas, por orden de llegada."
  pl: "Odkrywaj wybrzeże wokół plaży Žnjan na kajaku. Jeśli przywieziesz własny kajak, publiczne wybrzeże pozwala wiosłować wzdłuż brzegu i odkrywać zatoczki oraz widoki na morze bez systemu rezerwacji, według zasady kto pierwszy, ten lepszy."
  nl: "Verken de kustlijn rond het strand van Žnjan per kajak. Als je je eigen kajak meeneemt, kun je langs de openbare kust peddelen en baaien en zeezichten ontdekken zonder reserveringssysteem, op basis van wie het eerst komt, het eerst maalt."
